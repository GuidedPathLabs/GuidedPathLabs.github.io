<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a192f">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign In — Guided Path Noida</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="shared/gpn.css?v=1.0.0">
</head>
<body class="gpn-login-shell">

  <!-- ============================================================
       LOGIN CARD
       ============================================================ -->
  <main class="gpn-login-card" id="loginCard">

    <!-- Brand -->
    <div class="gpn-login-brand">
      <div class="gpn-login-logo">GPN</div>
      <h1 class="gpn-login-title">Guided Path Noida</h1>
      <p class="gpn-login-sub" id="modeSubtitle">Student Sign In</p>
    </div>

    <div class="gpn-login-divider"></div>

    <!-- Form -->
    <form id="loginForm" autocomplete="on" novalidate>

      <div class="gpn-field">
        <label class="gpn-label" for="loginId" id="loginIdLabel">Student ID</label>
        <input
          id="loginId"
          class="gpn-input"
          type="text"
          inputmode="text"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          autocomplete="username"
          placeholder="e.g. ol-arnav042 / hq-priya108"
          required
        >
      </div>

      <div class="gpn-field">
        <label class="gpn-label" for="password">Password</label>
        <input
          id="password"
          class="gpn-input"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          minlength="10"
          required
        >
      </div>

      <!-- Inline alert -->
      <div id="loginError" class="gpn-alert gpn-alert-error" role="alert" hidden></div>

      <!-- Submit -->
      <button
        type="submit"
        id="loginBtn"
        class="gpn-btn gpn-btn-primary gpn-btn-block gpn-btn-lg"
        style="margin-top: 20px;"
      >
        Sign In →
      </button>

    </form>

    <!-- Mode switch link -->
    <div class="gpn-login-foot">
      <a href="#" id="modeSwitch">Admin Login →</a>
    </div>

    <div class="gpn-login-foot" style="margin-top: 8px; font-size: 0.68rem; letter-spacing: 0.5px;">
      Trouble signing in? <a href="https://wa.me/guidedpathnoida" target="_blank" rel="noopener">Contact us on WhatsApp</a>
    </div>

  </main>

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <script src="shared/config.js?v=1.0.0"></script>
  <script src="shared/gpn.js?v=1.0.0"></script>
  <script>
    (function () {
      'use strict';

      /* ----------------------------------------------------------
       * Redirect already-authenticated users
       * -------------------------------------------------------- */
      GPN.ready(function () {
        if (GPN.Guard.redirectIfLoggedIn()) return;

        var form         = GPN.byId('loginForm');
        var idInput      = GPN.byId('loginId');
        var pwInput      = GPN.byId('password');
        var btn          = GPN.byId('loginBtn');
        var errBox       = GPN.byId('loginError');
        var idLabel      = GPN.byId('loginIdLabel');
        var modeSubtitle = GPN.byId('modeSubtitle');
        var modeSwitch   = GPN.byId('modeSwitch');

        var currentRole = 'STUDENT'; // 'STUDENT' | 'ADMIN'

        function showError(msg) {
          errBox.textContent = msg;
          errBox.hidden = false;
        }

        function clearError() {
          errBox.hidden = true;
          errBox.textContent = '';
        }

        function applyMode(role) {
          currentRole = role;
          if (role === 'ADMIN') {
            modeSubtitle.textContent = 'Administrator Access';
            idLabel.textContent      = 'Admin ID';
            idInput.placeholder      = 'Enter your admin ID';
            idInput.setAttribute('autocomplete', 'username');
            modeSwitch.textContent   = '← Student Login';
            document.title           = 'Admin Sign In — GPN';
          } else {
            modeSubtitle.textContent = 'Student Sign In';
            idLabel.textContent      = 'Student ID';
            idInput.placeholder      = 'e.g. ol-arnav042 / hq-priya108 / pr-rajesh001';
            idInput.setAttribute('autocomplete', 'username');
            modeSwitch.textContent   = 'Admin Login →';
            document.title           = 'Sign In — Guided Path Noida';
          }
          clearError();
          idInput.value = '';
          pwInput.value = '';
          idInput.focus();
        }

        /* ----------------------------------------------------------
         * Append ?mustChange=1 to a landing path
         * -------------------------------------------------------- */
        function withMustChange(path) {
          if (!path) return 'login.html?mustChange=1';
          var sep = path.indexOf('?') >= 0 ? '&' : '?';
          return path + sep + 'mustChange=1';
        }

        /* ----------------------------------------------------------
         * Mode switch link
         * -------------------------------------------------------- */
        GPN.on(modeSwitch, 'click', function (e) {
          e.preventDefault();
          applyMode(currentRole === 'ADMIN' ? 'STUDENT' : 'ADMIN');
        });

        /* ----------------------------------------------------------
         * Submit
         * -------------------------------------------------------- */
        GPN.on(form, 'submit', function (e) {
          e.preventDefault();
          clearError();

          var loginId  = idInput.value.trim();
          var password = pwInput.value;

          if (!loginId) {
            showError('Please enter your ID.');
            idInput.focus();
            return;
          }
          if (!password) {
            showError('Please enter your password.');
            pwInput.focus();
            return;
          }
          if (password.length < 6) {
            showError('Password must be at least 6 characters.');
            pwInput.focus();
            return;
          }

          GPN.setLoading(btn, true, 'Signing in…');

          GPN.api('auth.login', {
            loginId:  loginId,
            password: password,
            role:     currentRole
          }).then(function (json) {
            GPN.setLoading(btn, false);

            if (!json || !json.ok) {
              showError(GPN.friendlyError(json));
              pwInput.value = '';
              pwInput.focus();
              return;
            }

            /* Save session */
            GPN.Session.save(json.data || {});

            /* Determine landing page from session */
            var dest = GPN.Session.landingPage();

            /* If backend says password change is required, force it */
            if (json.data && json.data.mustChange === true) {
              dest = withMustChange(dest);
              GPN.Toast.warn('Please change your password to continue.');
            } else {
              GPN.Toast.ok('Welcome, ' + (json.data.name || json.data.userId || loginId));
            }

            setTimeout(function () {
              window.location.href = dest;
            }, 400);

          }).catch(function (err) {
            GPN.setLoading(btn, false);
            console.error('Login error:', err);
            showError('Something went wrong. Please try again.');
          });
        });

        /* ----------------------------------------------------------
         * Enter on password field triggers submit
         * -------------------------------------------------------- */
        GPN.on(pwInput, 'keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            form.dispatchEvent(new Event('submit', { cancelable: true }));
          }
        });

        /* ----------------------------------------------------------
         * URL hint: ?role=admin pre-selects admin mode
         * -------------------------------------------------------- */
        var q = GPN.query();
        if (q && String(q.role || '').toLowerCase() === 'admin') {
          applyMode('ADMIN');
        } else {
          idInput.focus();
        }
      });

    })();
  </script>
</body>
</html>
