<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a192f">
  <meta name="robots" content="noindex,nofollow">
  <title>My Dashboard — Guided Path Noida</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="shared/gpn.css?v=1.0.0">
</head>
<body>

<div class="gpn-page-loading" id="pageLoading">
  <div class="gpn-spinner"></div>
  <div>Loading your dashboard…</div>
</div>

<div class="gpn-app" hidden id="appRoot">

  <!-- ============================================================
       TOPBAR
       ============================================================ -->
  <header class="gpn-topbar">
    <div class="gpn-topbar-brand">
      <div class="gpn-brand-mark">GPN</div>
      <div class="gpn-brand-name">My <b>Dashboard</b></div>
    </div>
    <div class="gpn-topbar-user">
      <span class="gpn-user-badge" id="userBadge">—</span>
      <button class="gpn-btn gpn-btn-ghost gpn-btn-sm" id="btnChangePw" type="button">Password</button>
      <button class="gpn-btn gpn-btn-ghost gpn-btn-sm" id="btnLogout" type="button">Logout</button>
    </div>
  </header>

  <!-- ============================================================
       TAB STRIP — Online / Offline / Master
       ============================================================ -->
  <nav class="gpn-navstrip" id="tabStrip">
    <button class="gpn-navstrip-btn active" data-tab="online" type="button">Online</button>
    <button class="gpn-navstrip-btn" data-tab="offline" type="button">Offline</button>
    <button class="gpn-navstrip-btn" data-tab="master" type="button">Master</button>
  </nav>

  <!-- ============================================================
       MAIN
       ============================================================ -->
  <main class="gpn-main" id="viewRoot">
    <div class="gpn-loading"><span class="gpn-spinner"></span> Loading…</div>
  </main>

</div>

<!-- ============================================================
     CHANGE PASSWORD MODAL
     ============================================================ -->
<div class="gpn-modal" id="pwModal" hidden>
  <div class="gpn-modal-card">
    <h3 class="gpn-modal-title">Change Password</h3>
    <p class="gpn-modal-sub" id="pwSubtitle">Choose a strong password of at least 10 characters.</p>

    <form id="pwForm" novalidate>
      <div class="gpn-field">
        <label class="gpn-label" for="pwCurrent">Current Password</label>
        <input id="pwCurrent" type="password" class="gpn-input" autocomplete="current-password" required>
      </div>
      <div class="gpn-field">
        <label class="gpn-label" for="pwNew">New Password</label>
        <input id="pwNew" type="password" class="gpn-input" autocomplete="new-password" minlength="10" required>
      </div>
      <div class="gpn-field">
        <label class="gpn-label" for="pwConfirm">Confirm New Password</label>
        <input id="pwConfirm" type="password" class="gpn-input" autocomplete="new-password" minlength="10" required>
      </div>

      <div id="pwAlert" class="gpn-alert gpn-alert-error" hidden></div>

      <div class="gpn-modal-actions">
        <button type="button" class="gpn-btn gpn-btn-ghost" id="pwCancel">Cancel</button>
        <button type="submit" class="gpn-btn gpn-btn-cyan" id="pwSubmit">Update Password</button>
      </div>
    </form>
  </div>
</div>

<!-- ============================================================
     SCRIPTS
     ============================================================ -->
<script src="shared/config.js?v=1.0.0"></script>
<script src="shared/gpn.js?v=1.0.0"></script>
<script>
(function () {
  'use strict';

  /* ==========================================================
     GUARD
     ========================================================== */
  if (!GPN.Guard.requireStudent()) return;

  /* ==========================================================
     STATE
     ========================================================== */
  var forcedChange = false;
  var pwModalEl    = null;
  var currentTab   = 'online';

  /* Cached data — filled once on load, reused by tab switches */
  var DATA = {
    announcement: null,
    counters:     null,
    socials:      null,
    dashboard:    null,
    materials:    null,
    tests:        null,
    performance:  null
  };

  /* ==========================================================
     BOOT
     ========================================================== */
  GPN.ready(function () {
    pwModalEl = GPN.byId('pwModal');

    GPN.byId('userBadge').textContent = GPN.Session.getName() || 'Student';
    GPN.byId('userBadge').title = GPN.Session.getUser() || '';

    /* Reveal app */
    GPN.byId('appRoot').hidden = false;
    GPN.byId('pageLoading').hidden = true;

    /* Tab switching */
    GPN.$$('#tabStrip .gpn-navstrip-btn').forEach(function (btn) {
      GPN.on(btn, 'click', function () {
        GPN.$$('#tabStrip .gpn-navstrip-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        renderTab(currentTab);
      });
    });

    /* Logout */
    GPN.on(GPN.byId('btnLogout'), 'click', function () {
      if (!confirm('Sign out of GPN Central?')) return;
      GPN.Guard.logout();
    });

    /* Modal wiring — respects forcedChange */
    GPN.on(pwModalEl, 'click', function (e) {
      if (forcedChange) return;
      if (e.target === pwModalEl) GPN.Modal.close('pwModal');
    });

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' || pwModalEl.hidden) return;
      if (forcedChange) { e.preventDefault(); return; }
      GPN.Modal.close('pwModal');
    });

    /* Cancel button — blocked in forced mode */
    GPN.on(GPN.byId('pwCancel'), 'click', function () {
      if (forcedChange) return;
      GPN.Modal.close('pwModal');
    });

    /* Password button (topbar) */
    GPN.on(GPN.byId('btnChangePw'), 'click', function () {
      forcedChange = false;
      openPwModal();
    });

    /* Form submit */
    GPN.on(GPN.byId('pwForm'), 'submit', function (e) {
      e.preventDefault();
      handleChangePassword();
    });

    /* Forced-change detection */
    var q = GPN.query();
    if (String((q && q.mustChange) || '') === '1') {
      enterForcedMode();
    }

    GPN.api('auth.me').then(function (j) {
      if (j && j.ok && j.data && j.data.mustChange === true) {
        enterForcedMode();
      }
    });

    /* Load all data in parallel, then render Online tab */
    loadAll();
  });


  /* ==========================================================
     FORCED-CHANGE FLOW
     ========================================================== */
  function enterForcedMode() {
    if (forcedChange) return;
    forcedChange = true;
    GPN.byId('pwCancel').style.display = 'none';
    GPN.byId('pwSubtitle').textContent =
      'For security, please change your password to continue. Cancel is disabled until you set a new password.';
    openPwModal();
  }

  function exitForcedMode() {
    forcedChange = false;
    GPN.byId('pwCancel').style.display = '';
    GPN.byId('pwSubtitle').textContent =
      'Choose a strong password of at least 10 characters.';
  }

  function openPwModal() {
    GPN.byId('pwAlert').hidden = true;
    GPN.byId('pwForm').reset();
    GPN.Modal.open('pwModal');
  }


  /* ==========================================================
     LOAD ALL DATA
     ========================================================== */
  function loadAll() {
    Promise.all([
      GPN.api('studentDashboard'),
      GPN.api('studentMaterials'),
      GPN.api('studentTests'),
      GPN.api('studentPerformance'),
      GPN.api('studentAnnouncement'),
      GPN.api('studentCounters'),
      GPN.api('studentSocials')
    ]).then(function (res) {
      DATA.dashboard   = (res[0] && res[0].ok) ? res[0].data : null;
      DATA.materials   = (res[1] && res[1].ok) ? res[1].data : null;
      DATA.tests       = (res[2] && res[2].ok) ? res[2].data : null;
      DATA.performance = (res[3] && res[3].ok) ? res[3].data : null;
      DATA.announcement= (res[4] && res[4].ok) ? res[4].data : null;
      DATA.counters    = (res[5] && res[5].ok) ? res[5].data : null;
      DATA.socials     = (res[6] && res[6].ok) ? res[6].data : null;

      renderTab(currentTab);
    }).catch(function (err) {
      console.error('Load failed:', err);
      GPN.showContainerError(GPN.byId('viewRoot'), 'Failed to load your dashboard. Please refresh.');
    });
  }


  /* ==========================================================
     TAB ROUTER
     ========================================================== */
  function renderTab(tab) {
    if (tab === 'online')  return renderOnline();
    if (tab === 'offline') return renderNotEnrolled('Offline');
    if (tab === 'master')  return renderNotEnrolled('Master');
  }


  /* ==========================================================
     NOT ENROLLED — ads page
     ========================================================== */
  function renderNotEnrolled(moduleName) {
    var wa = GPN.cfg('WHATSAPP', 'https://wa.me/guidedpathnoida');
    var site = GPN.cfg('WEBSITE', 'https://guidedpathnoida.in');

    GPN.byId('viewRoot').innerHTML =
      '<div class="gpn-admin-hero">' +
        '<h1 class="gpn-admin-hero-title">' + GPN.esc(moduleName) + ' Programme</h1>' +
        '<p class="gpn-admin-hero-sub">You are not currently enrolled in the ' + GPN.esc(moduleName) + ' module.</p>' +
      '</div>' +
      '<div class="gpn-card">' +
        '<div class="gpn-card-head"><h3 class="gpn-card-title">Explore ' + GPN.esc(moduleName) + ' Programme</h3></div>' +
        '<div class="gpn-card-body">' +
          '<p style="color:var(--tx-dim);line-height:1.7;margin-bottom:16px;">' +
            'The ' + GPN.esc(moduleName) + ' module offers a full curriculum with structured lessons, tests, ' +
            'materials, and progress tracking. To know more about joining, contact us:' +
          '</p>' +
          '<div class="gpn-row">' +
            '<a class="gpn-btn gpn-btn-primary" href="' + GPN.esc(wa) + '" target="_blank" rel="noopener">WhatsApp us</a>' +
            '<a class="gpn-btn gpn-btn-ghost" href="' + GPN.esc(site) + '" target="_blank" rel="noopener">Visit website</a>' +
          '</div>' +
        '</div>' +
      '</div>';
  }


  /* ==========================================================
     ONLINE — full dashboard
     ========================================================== */
  function renderOnline() {
    var d = DATA.dashboard;
    if (!d) {
      GPN.showContainerError(GPN.byId('viewRoot'), 'Your dashboard data is not available right now.');
      return;
    }

    var s = d.student || {};
    var html = '';

    /* Announcement */
    if (DATA.announcement && DATA.announcement.active && DATA.announcement.html) {
      html += '<div class="gpn-announce" id="annBox">' +
        '<button class="gpn-announce-close" type="button" id="annClose" aria-label="Dismiss">×</button>' +
        (DATA.announcement.title ? '<div class="gpn-announce-title">' + GPN.esc(DATA.announcement.title) + '</div>' : '') +
        '<div>' + DATA.announcement.html + '</div>' +
      '</div>';
    }

    /* Welcome */
    html += '<section class="gpn-welcome">' +
      '<h1 class="gpn-welcome-title">Hi, ' + GPN.esc(s.Name || 'Student') + '</h1>' +
      '<p class="gpn-welcome-sub">' +
        GPN.esc(s.StudentID || '') +
        (s.Class ? ' · ' + GPN.esc(s.Class) : '') +
        (s.Board ? ' · ' + GPN.esc(s.Board) : '') +
        (d.access ? ' · <span class="gpn-pill ' + GPN.esc(String(d.access).toLowerCase()) + '">' + GPN.esc(d.access) + '</span>' : '') +
      '</p>' +
    '</section>';

    /* Counters */
    if (DATA.counters && DATA.counters.counters && DATA.counters.counters.length) {
      html += '<div class="gpn-counters">' +
        DATA.counters.counters.map(function (c) {
          return '<div class="gpn-counter">' +
            (c.icon ? '<div class="gpn-counter-icon">' + GPN.esc(c.icon) + '</div>' : '') +
            '<div class="gpn-counter-value">' + GPN.esc(c.value || '') + '</div>' +
            '<div class="gpn-counter-label">' + GPN.esc(c.label || '') + '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    }

    /* 3 stat cards */
    var recent = d.recentResult || null;
    var nextTest = d.nextTest || null;
    html += '<div class="gpn-stats">' +
      '<div class="gpn-stat">' +
        '<span class="gpn-stat-label">Wallet Balance</span>' +
        '<span class="gpn-stat-value gold">' + GPN.formatCurrency(d.walletBalance || 0) + '</span>' +
      '</div>' +
      '<div class="gpn-stat">' +
        '<span class="gpn-stat-label">Tests Taken</span>' +
        '<span class="gpn-stat-value">' + ((d.summary && d.summary.tests) || 0) + '</span>' +
      '</div>' +
      '<div class="gpn-stat">' +
        '<span class="gpn-stat-label">Average Score</span>' +
        '<span class="gpn-stat-value cyan">' + GPN.formatPercent((d.summary && d.summary.avg) || 0) + '</span>' +
      '</div>' +
    '</div>';

    /* Today's tasks */
    if (d.todayTasks && d.todayTasks.length) {
      html += '<div class="gpn-card">' +
        '<div class="gpn-card-head"><h3 class="gpn-card-title">Today</h3></div>' +
        '<div class="gpn-card-body">' +
          d.todayTasks.map(function (t) {
            return '<div class="gpn-row-between" style="padding:8px 0;border-bottom:1px solid var(--border-hair);">' +
              '<div>' +
                '<div class="gpn-strong">' + GPN.esc(t.Type) + '</div>' +
                '<div class="gpn-quiet">' + GPN.esc(t.StartTime || '') + (t.EndTime ? ' – ' + GPN.esc(t.EndTime) : '') + '</div>' +
              '</div>' +
              '<span class="gpn-pill info">' + GPN.esc(t.Status || 'ACTIVE') + '</span>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>';
    }

    /* Recent reschedules */
    if (d.recentReschedules && d.recentReschedules.length) {
      html += '<div class="gpn-alert gpn-alert-warn">' +
        '<b>Rescheduled:</b> ' +
        d.recentReschedules.map(function (r) {
          return GPN.esc(r.Type) + ' on ' + GPN.esc(GPN.formatDate(r.Date)) +
                 (r.StartTime ? ' at ' + GPN.esc(r.StartTime) : '');
        }).join(' · ') +
      '</div>';
    }

    /* Tests section */
    html += '<section class="gpn-section" id="testsSection">' +
      '<h2 class="gpn-page-title" style="font-size:1.05rem;margin-bottom:12px;">Your Tests</h2>' +
      renderTests()
    '</section>';

    /* Results */
    html += '<section class="gpn-section">' +
      '<h2 class="gpn-page-title" style="font-size:1.05rem;margin-bottom:12px;">Recent Results</h2>' +
      renderResults(d)
    '</section>';

    /* Materials */
    html += '<section class="gpn-section">' +
      '<h2 class="gpn-page-title" style="font-size:1.05rem;margin-bottom:12px;">Study Materials</h2>' +
      renderMaterials()
    '</section>';

    /* Performance */
    html += '<section class="gpn-section">' +
      '<h2 class="gpn-page-title" style="font-size:1.05rem;margin-bottom:12px;">Performance</h2>' +
      renderPerformance()
    '</section>';

    /* Socials */
    if (DATA.socials && DATA.socials.links && DATA.socials.links.length) {
      html += '<section class="gpn-section">' +
        '<h2 class="gpn-page-title" style="font-size:1.05rem;margin-bottom:12px;">Connect with Us</h2>' +
        '<div class="gpn-social-grid">' +
          DATA.socials.links.map(function (l) {
            return '<a class="gpn-social-link" href="' + GPN.esc(l.url) + '" target="_blank" rel="noopener">' +
              (l.icon ? '<span class="gpn-social-icon">' + GPN.esc(l.icon) + '</span>' : '') +
              '<span class="gpn-social-name">' + GPN.esc(l.label) + '</span>' +
            '</a>';
          }).join('') +
          (DATA.socials.gbp ? '<a class="gpn-social-link" href="' + GPN.esc(DATA.socials.gbp) + '" target="_blank" rel="noopener">' +
            '<span class="gpn-social-icon">★</span><span class="gpn-social-name">Review us on Google</span></a>' : '') +
        '</div>' +
      '</section>';
    }

    /* Footer */
    html += '<footer class="gpn-footer">' +
      '<div>Guided Path Noida</div>' +
      '<div style="margin-top:6px;">' +
        '<a href="https://guidedpathnoida.in" target="_blank" rel="noopener">guidedpathnoida.in</a> · ' +
        '<a href="https://wa.me/guidedpathnoida" target="_blank" rel="noopener">WhatsApp</a>' +
      '</div>' +
    '</footer>';

    GPN.byId('viewRoot').innerHTML = html;

    /* Wire announcement close */
    var annClose = GPN.byId('annClose');
    if (annClose) {
      GPN.on(annClose, 'click', function () {
        var box = GPN.byId('annBox');
        if (box) box.style.display = 'none';
      });
    }

    /* Wire test start buttons */
    GPN.$$('#testsSection button[data-start]').forEach(function (b) {
      GPN.on(b, 'click', function () { startTest(b.dataset.start, b); });
    });

    /* Wire material open buttons */
    GPN.$$('#viewRoot button[data-mat]').forEach(function (b) {
      GPN.on(b, 'click', function () { openMaterial(b.dataset.mat); });
    });
  }


  /* ==========================================================
     TESTS RENDERER
     ========================================================== */
  function renderTests() {
    var t = DATA.tests;
    if (!t || !t.tests || !t.tests.length) {
      return '<div class="gpn-card"><div class="gpn-card-body"><div class="gpn-empty-state">No tests available right now.</div></div></div>';
    }

    return t.tests.map(function (item) {
      var test = item.test || {};
      var sch = item.schedule;
      var att = item.attempt;
      var res = item.result;

      var card = '<div class="gpn-test-card">';
      card += '<h3 class="gpn-test-title">' + GPN.esc(test.Title || 'Test') + '</h3>';

      var metaParts = [];
      if (test.TotalMarks) metaParts.push(test.TotalMarks + ' marks');
      if (test.Duration)   metaParts.push(test.Duration + ' min');
      if (test.Price > 0)  metaParts.push(GPN.formatCurrency(test.Price));
      if (sch) {
        metaParts.push(
          'Scheduled ' + GPN.esc(GPN.formatDate(sch.Date)) +
          (sch.StartTime ? ' at ' + GPN.esc(sch.StartTime) : '')
        );
      }
      card += '<div class="gpn-test-meta">' + metaParts.join(' · ') + '</div>';

      /* Status row */
      var statusBadge = '';
      if (res) {
        statusBadge = '<span class="gpn-pill published">Score ' + GPN.esc(res.MarksObtained) + '/' + GPN.esc(res.MaxMarks) + ' (' + GPN.esc(res.Percentage) + '%)</span>';
      } else if (att && att.Status === 'PUBLISHED') {
        statusBadge = '<span class="gpn-pill published">Published</span>';
      } else if (att && att.Status === 'EVALUATED') {
        statusBadge = '<span class="gpn-pill evaluated">Evaluated</span>';
      } else if (att && att.Status === 'SUBMITTED') {
        statusBadge = '<span class="gpn-pill warn">Submitted — waiting for evaluation</span>';
      } else if (att && att.Code) {
        /* Active attempt — show code panel */
        card += renderCodePanel(att, test);
        card += '</div>';
        return card;
      } else if (!item.canAfford) {
        statusBadge = '<span class="gpn-pill error">Insufficient balance</span>';
      } else if (test.Status === 'AVAILABLE') {
        statusBadge = '<button class="gpn-btn gpn-btn-primary gpn-btn-sm" data-start="' + GPN.esc(test.TestID) + '" type="button">Start Test</button>';
      } else if (test.Status === 'CLOSED') {
        statusBadge = '<span class="gpn-pill closed">Closed</span>';
      } else {
        statusBadge = '<span class="gpn-pill ' + GPN.esc(String(test.Status || '').toLowerCase()) + '">' + GPN.esc(test.Status) + '</span>';
      }

      card += '<div class="gpn-row-between">' + statusBadge + '</div>';
      card += '</div>';
      return card;
    }).join('');
  }

  function renderCodePanel(att, test) {
    var formUrl = test.FormURL || '';
    var html = '<div class="gpn-code-panel">' +
      '<div class="gpn-code-label">Your Submission Code</div>' +
      '<div class="gpn-code-value">' + GPN.esc(att.Code) + '</div>' +
      '<div class="gpn-code-actions">' +
        '<button class="gpn-btn gpn-btn-cyan gpn-btn-sm" type="button" id="copyCodeBtn" data-code="' + GPN.esc(att.Code) + '">Copy Code</button>' +
        (formUrl ? '<a class="gpn-btn gpn-btn-primary gpn-btn-sm" href="' + GPN.esc(formUrl) + '" target="_blank" rel="noopener">Open Test Form</a>' : '') +
      '</div>' +
      (att.ExpiresAt ? '<div class="gpn-code-expiry">Expires: ' + GPN.esc(GPN.formatDateTime(att.ExpiresAt)) + '</div>' : '') +
    '</div>';

    setTimeout(function () {
      var cb = GPN.byId('copyCodeBtn');
      if (cb) GPN.on(cb, 'click', function () { GPN.Export.copy(cb.dataset.code, 'Code copied'); });
    }, 30);

    return html;
  }


  /* ==========================================================
     RESULTS RENDERER
     ========================================================== */
  function renderResults(d) {
    var recent = (d.summary && d.summary.recent) || [];
    if (!recent.length) {
      return '<div class="gpn-card"><div class="gpn-card-body"><div class="gpn-empty-state">No results published yet.</div></div></div>';
    }
    return '<div class="gpn-card"><div class="gpn-table-wrap" style="border:none;border-radius:0;">' +
      '<table class="gpn-table"><thead><tr>' +
        '<th>Test</th><th>Subject</th><th>Score</th><th>%</th><th>Date</th>' +
      '</tr></thead><tbody>' +
      recent.map(function (r) {
        return '<tr>' +
          '<td data-label="Test">' + GPN.esc(r.TestTitle || r.TestID || '') + '</td>' +
          '<td data-label="Subject">' + GPN.esc(r.SubjectName || r.SubjectID || '—') + '</td>' +
          '<td data-label="Score">' + GPN.esc(r.MarksObtained) + ' / ' + GPN.esc(r.MaxMarks) + '</td>' +
          '<td data-label="%" style="color:var(--gold);font-weight:700;">' + GPN.esc(r.Percentage) + '</td>' +
          '<td data-label="Date">' + GPN.esc(GPN.formatDate(r.PublishedDate || r.TestDate)) + '</td>' +
        '</tr>';
      }).join('') +
    '</tbody></table></div></div>';
  }


  /* ==========================================================
     MATERIALS RENDERER
     ========================================================== */
  function renderMaterials() {
    var m = DATA.materials;
    if (!m || !m.materials || !m.materials.length) {
      return '<div class="gpn-card"><div class="gpn-card-body"><div class="gpn-empty-state">No materials available yet.</div></div></div>';
    }

    return m.materials.map(function (mat) {
      var view = m.views && m.views[mat.MaterialID];
      var viewInfo = view
        ? 'Opened ' + (view.ViewCount || 0) + ' time(s)'
        : 'Not opened yet';

      return '<div class="gpn-card" style="margin-bottom:12px;">' +
        '<div class="gpn-card-body">' +
          '<div class="gpn-strong" style="color:var(--cyan-bright);font-family:var(--font-serif);font-size:1rem;">' + GPN.esc(mat.Title) + '</div>' +
          '<div class="gpn-quiet" style="margin-top:4px;">' +
            GPN.esc(mat.Type || '') +
            (mat.SubjectName ? ' · ' + GPN.esc(mat.SubjectName) : '') +
            (mat.ChapterName ? ' · ' + GPN.esc(mat.ChapterName) : '') +
          '</div>' +
          (mat.Description ? '<div class="gpn-quiet" style="margin-top:6px;font-size:0.82rem;">' + GPN.esc(mat.Description) + '</div>' : '') +
          '<div class="gpn-file-actions">' +
            '<button class="gpn-file-btn gpn-file-btn-view" type="button" data-mat="' + GPN.esc(mat.MaterialID) + '">View</button>' +
          '</div>' +
          '<div class="gpn-quiet" style="font-size:0.72rem;">' + GPN.esc(viewInfo) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }


  /* ==========================================================
     PERFORMANCE RENDERER
     ========================================================== */
  function renderPerformance() {
    var p = DATA.performance;
    if (!p) {
      return '<div class="gpn-card"><div class="gpn-card-body"><div class="gpn-empty-state">Performance data unavailable.</div></div></div>';
    }
    var s = p.summary || {};

    var html = '<div class="gpn-stats">' +
      '<div class="gpn-stat"><span class="gpn-stat-label">Average</span><span class="gpn-stat-value cyan">' + GPN.formatPercent(s.avg || 0) + '</span></div>' +
      '<div class="gpn-stat"><span class="gpn-stat-label">Highest</span><span class="gpn-stat-value green">' + GPN.formatPercent(s.highest || 0) + '</span></div>' +
      '<div class="gpn-stat"><span class="gpn-stat-label">Lowest</span><span class="gpn-stat-value warn">' + GPN.formatPercent(s.lowest || 0) + '</span></div>' +
      '<div class="gpn-stat"><span class="gpn-stat-label">Tests</span><span class="gpn-stat-value">' + (s.tests || 0) + '</span></div>' +
    '</div>';

    if (p.bySubject && p.bySubject.length) {
      html += '<div class="gpn-card">' +
        '<div class="gpn-card-head"><h3 class="gpn-card-title">By Subject</h3></div>' +
        '<div class="gpn-table-wrap" style="border:none;border-radius:0;">' +
          '<table class="gpn-table"><thead><tr><th>Subject</th><th>Avg %</th><th>Tests</th></tr></thead><tbody>' +
            p.bySubject.map(function (x) {
              return '<tr>' +
                '<td data-label="Subject">' + GPN.esc(x.name) + '</td>' +
                '<td data-label="Avg %" style="color:var(--gold);font-weight:700;">' + GPN.formatPercent(x.avg || 0) + '</td>' +
                '<td data-label="Tests">' + (x.tests || 0) + '</td>' +
              '</tr>';
            }).join('') +
          '</tbody></table>' +
        '</div>' +
      '</div>';
    }

    return html;
  }


  /* ==========================================================
     START TEST
     ========================================================== */
  function startTest(testId, btn) {
    if (!testId) return;
    if (!confirm('Start this test? ' + 'Wallet will be charged if the test has a fee.')) return;

    GPN.setLoading(btn, true, 'Starting…');
    GPN.api('studentStartTest', { testId: testId }).then(function (j) {
      GPN.setLoading(btn, false);
      if (!j || !j.ok) {
        var msg = GPN.friendlyError(j);
        var d = j && j.data;
        if (j && j.error === 'INSUFFICIENT_BALANCE' && d) {
          msg = 'Insufficient balance. You have ' + GPN.formatCurrency(d.balance) +
                ', need ' + GPN.formatCurrency(d.required) + '.';
        }
        GPN.Toast.error(msg);
        return;
      }
      GPN.Toast.ok('Test started. Copy your submission code.');
      /* Reload tests to reflect active attempt */
      GPN.api('studentTests').then(function (t) {
        if (t && t.ok) DATA.tests = t.data;
        renderTab('online');
      });
    });
  }


  /* ==========================================================
     OPEN MATERIAL
     ========================================================== */
  function openMaterial(materialId) {
    if (!materialId) return;
    GPN.api('studentOpenMaterial', { materialId: materialId }).then(function (j) {
      if (!j || !j.ok) {
        GPN.Toast.error(GPN.friendlyError(j));
        return;
      }
      var d = j.data || {};
      if (d.viewUrl) {
        window.open(d.viewUrl, '_blank', 'noopener');
      } else {
        GPN.Toast.error('Material URL not available.');
      }
      /* Refresh materials to update view count */
      GPN.api('studentMaterials').then(function (m) {
        if (m && m.ok) DATA.materials = m.data;
      });
    });
  }


  /* ==========================================================
     CHANGE PASSWORD
     ========================================================== */
  function handleChangePassword() {
    var alertBox = GPN.byId('pwAlert');
    var btn      = GPN.byId('pwSubmit');
    alertBox.hidden = true;

    var current = GPN.byId('pwCurrent').value;
    var next    = GPN.byId('pwNew').value;
    var confirm = GPN.byId('pwConfirm').value;

    if (!current || !next || !confirm) { showPwError('Please fill in all fields.'); return; }
    if (next.length < 10) { showPwError('New password must be at least 10 characters.'); return; }
    if (next !== confirm) { showPwError('New password and confirmation do not match.'); return; }
    if (next === current) { showPwError('New password must differ from the current one.'); return; }

    GPN.setLoading(btn, true, 'Updating…');

    GPN.api('auth.changePassword', {
      currentPassword: current,
      newPassword:     next
    }).then(function (j) {
      GPN.setLoading(btn, false);

      if (!j || !j.ok) {
        showPwError(GPN.friendlyError(j));
        return;
      }

      GPN.Session.save(j.data || {});
      exitForcedMode();
      GPN.Modal.close('pwModal');
      GPN.Toast.ok('Password updated successfully.');

      setTimeout(function () {
        window.location.replace('student-online.html');
      }, 700);
    });
  }

  function showPwError(msg) {
    var el = GPN.byId('pwAlert');
    el.textContent = msg;
    el.hidden = false;
  }

})();
</script>
</body>
</html>
