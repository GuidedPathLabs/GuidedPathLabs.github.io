<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Student — Guided Path One-on-One</title>
<style>
:root{--bg:#060f1e;--bg2:#0a192f;--bg3:#102844;--line:rgba(0,184,212,.22);--l2:rgba(0,184,212,.12);--cy:#00e5ff;--gold:#ffd54f;--tx:#e0e0e0;--mu:#8a9bb0;--dng:#ff6b6b;--ok:#4caf50;--wn:#ffb300}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-text-size-adjust:100%}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--cy)}
.app-root{min-height:100vh;width:100%;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(6,15,30,.96);border-bottom:1px solid var(--line);min-height:56px}
.brand{font-size:1rem;font-weight:700;color:var(--cy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--gold)}
.user{font-size:.8rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45vw}
.burger{display:none;background:transparent;border:1px solid var(--line);color:var(--cy);font-size:1.2rem;border-radius:6px;width:40px;height:40px;cursor:pointer}
.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;max-width:1280px;margin:0 auto;padding:20px 16px 60px}
.sidebar{position:sticky;top:72px;align-self:start;background:var(--bg2);border:1px solid var(--l2);border-radius:10px;padding:12px;max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--cy) transparent}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-track{background:transparent}
.sidebar::-webkit-scrollbar-thumb{background:rgba(0,184,212,.35);border-radius:3px}
.sidebar::-webkit-scrollbar-thumb:hover{background:rgba(0,184,212,.6)}
.sidebar h4{margin:12px 8px 6px;font-size:.68rem;letter-spacing:.14em;color:var(--mu);text-transform:uppercase}
.navbtn{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--tx);font-family:inherit;font-size:.85rem;padding:9px 12px;border-radius:6px;cursor:pointer;margin-bottom:2px;transition:.15s}
.navbtn:hover{background:rgba(0,184,212,.06);color:var(--cy)}
.navbtn.active{background:rgba(0,184,212,.1);border-color:var(--line);color:var(--gold);font-weight:700}
.navbtn.danger{color:var(--dng)}
.content{min-width:0}
.stitle{font-size:1.3rem;color:var(--cy);margin:0 0 4px;font-weight:700}
.ssub{color:var(--mu);font-size:.85rem;margin:0 0 20px}
.panel{background:var(--bg2);border:1px solid var(--l2);border-radius:10px;padding:18px;margin-bottom:18px}
.ptitle{font-size:.95rem;color:var(--gold);margin:0 0 12px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--bg3);border:1px solid var(--l2);border-radius:8px;padding:14px 16px}
.stat .lbl{display:block;font-size:.68rem;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.stat .val{display:block;font-size:1.5rem;font-weight:700;color:var(--cy);line-height:1.1}
.stat .val.gold{color:var(--gold)}
.stat .val.dng{color:var(--dng)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;font-family:inherit;font-size:.83rem;font-weight:700;letter-spacing:.03em;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:rgba(0,184,212,.08);color:var(--cy);min-height:38px;text-decoration:none}
.btn:hover{background:rgba(0,184,212,.16);border-color:var(--cy)}
.btn.gold{border-color:rgba(255,213,79,.45);color:var(--gold);background:rgba(255,213,79,.06)}
.btn.gold:hover{background:rgba(255,213,79,.14);border-color:var(--gold)}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--l2)}
.btn.ghost:hover{border-color:var(--cy);color:var(--cy)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:8px 14px;font-size:.75rem;min-height:36px}
.arow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fg{display:flex;flex-direction:column;gap:4px;min-width:0}
.fg label{font-size:.68rem;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;background:rgba(0,0,0,.35);border:1px solid var(--l2);border-radius:6px;color:var(--tx);font-family:inherit;font-size:.9rem;min-height:40px}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 2px rgba(0,229,255,.12)}
.hint{font-size:.72rem;color:var(--mu)}
.twrap{width:100%;overflow-x:auto;border:1px solid var(--l2);border-radius:8px;background:var(--bg2);-webkit-overflow-scrolling:touch}
table.tbl{width:100%;min-width:560px;border-collapse:collapse;font-size:.82rem}
.tbl th,.tbl td{padding:9px 11px;text-align:left;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
.tbl th{font-size:.66rem;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;background:rgba(0,184,212,.04);position:sticky;top:0;z-index:1}
.tbl td.wrap{white-space:normal;word-break:break-word}
.tbl tr:hover td{background:rgba(0,184,212,.03)}
.bdg{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.66rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:1px solid transparent}
.bdg.draft{color:#8a9bb0;border-color:rgba(138,155,176,.4)}
.bdg.available{color:var(--cy);border-color:rgba(0,229,255,.5);background:rgba(0,229,255,.08)}
.bdg.closed{color:var(--wn);border-color:rgba(255,179,0,.5);background:rgba(255,179,0,.08)}
.bdg.evaluated{color:var(--gold);border-color:rgba(255,213,79,.5);background:rgba(255,213,79,.08)}
.bdg.published{color:var(--ok);border-color:rgba(76,175,80,.5);background:rgba(76,175,80,.08)}
.bdg.active{color:var(--ok);border-color:rgba(76,175,80,.4)}
.bdg.none{color:var(--mu);border-color:rgba(138,155,176,.3)}
.bdg.expired{color:var(--dng);border-color:rgba(255,107,107,.4)}
.bdg.expiring{color:var(--wn);border-color:rgba(255,179,0,.4)}
.bdg.notes{color:var(--cy);border-color:rgba(0,229,255,.4)}
.bdg.solution{color:var(--ok);border-color:rgba(76,175,80,.4)}
.bdg.worksheet{color:var(--gold);border-color:rgba(255,213,79,.4)}
.bdg.video{color:var(--dng);border-color:rgba(255,107,107,.4)}
.bdg.other{color:var(--mu);border-color:rgba(138,155,176,.4)}
.load{padding:28px 20px;text-align:center;border-radius:8px;font-size:.9rem;color:var(--cy);background:rgba(0,184,212,.04)}
.empty{padding:28px 20px;text-align:center;border-radius:8px;font-size:.9rem;color:var(--mu);background:rgba(255,255,255,.02);border:1px dashed var(--l2)}
.err{padding:28px 20px;text-align:center;border-radius:8px;font-size:.9rem;color:var(--dng);background:rgba(255,107,107,.06);border:1px solid rgba(255,107,107,.3)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(0,229,255,.25);border-top-color:var(--cy);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.tw{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 32px);pointer-events:none}
.tt{background:var(--bg3);border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:6px;font-size:.85rem;box-shadow:0 4px 16px rgba(0,0,0,.4);pointer-events:auto}
.tt.ok{border-color:rgba(76,175,80,.5);color:#b6e8b6}
.tt.error{border-color:rgba(255,107,107,.5);color:#ffbaba}
.mono{font-family:'Courier New',monospace;font-size:.82rem;color:var(--cy)}
.quiet{color:var(--mu);font-size:.82rem}
.mt16{margin-top:16px}
.announce{background:linear-gradient(135deg,#0a192f 0%,#102844 100%);border:1px solid rgba(0,184,212,.35);border-left:4px solid var(--cy);border-radius:10px;padding:16px 18px;margin-bottom:18px;position:relative}
.announce .atitle{font-size:.85rem;color:var(--gold);font-weight:700;letter-spacing:.04em;margin:0 0 8px}
.announce .aclose{position:absolute;top:8px;right:10px;background:transparent;border:none;color:var(--mu);font-size:1.2rem;cursor:pointer;padding:4px 8px;line-height:1}
.counter-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:18px}
.counter{background:var(--bg3);border:1px solid var(--l2);border-radius:8px;padding:12px;text-align:center}
.counter .icn{font-size:1.4rem;line-height:1}
.counter .num{font-size:1.3rem;font-weight:700;color:var(--gold);margin:4px 0 2px;line-height:1.1}
.counter .lbl{font-size:.65rem;color:var(--mu);letter-spacing:.05em;text-transform:uppercase;line-height:1.3}
.help-box{background:rgba(0,184,212,.06);border:1px solid rgba(0,184,212,.2);border-left:3px solid var(--cy);border-radius:0 6px 6px 0;padding:12px 14px;margin-top:16px;font-size:.85rem}
.help-box a{color:var(--cy);font-weight:600}
.test-card{background:var(--bg2);border:1px solid var(--l2);border-radius:10px;padding:16px;margin-bottom:14px}
.test-card .tname{font-size:1rem;color:var(--cy);font-weight:700;margin-bottom:4px}
.test-card .tmeta{font-size:.8rem;color:var(--mu);margin-bottom:10px}
.test-card .tactions{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.mat-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--l2);border-radius:20px;background:transparent;color:var(--mu);font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer;transition:.15s;letter-spacing:.03em;min-height:36px}
.chip:hover{border-color:var(--cy);color:var(--cy)}
.chip.active{background:rgba(0,184,212,.1);border-color:var(--cy);color:var(--gold)}
.search-input{flex:1;min-width:180px;padding:10px 14px;background:rgba(0,0,0,.35);border:1px solid var(--l2);border-radius:20px;color:var(--tx);font-family:inherit;font-size:.85rem;min-height:40px}
.search-input:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 2px rgba(0,229,255,.12)}
.mat-group{margin-bottom:22px}
.mat-group-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--l2)}
.mat-group-hd .sg-title{font-size:.95rem;color:var(--gold);font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mat-group-hd .sg-count{font-size:.7rem;color:var(--mu);background:rgba(0,184,212,.06);border:1px solid var(--l2);border-radius:10px;padding:2px 10px}
.mat-card{background:var(--bg2);border:1px solid var(--l2);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:grid;gap:10px;grid-template-columns:1fr auto;align-items:center}
.mat-card .mt-title{font-size:.9rem;color:var(--tx);font-weight:600;margin-bottom:4px;line-height:1.3}
.mat-card .mt-meta{font-size:.72rem;color:var(--mu);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mat-card .mt-actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:600px){.mat-card{grid-template-columns:1fr}.mat-card .mt-actions{width:100%}.mat-card .mt-actions .btn{flex:1}}
.code-panel{background:linear-gradient(135deg,rgba(0,184,212,.08),rgba(255,213,79,.06));border:1px solid rgba(0,229,255,.4);border-radius:8px;padding:14px 16px;margin-top:12px}
.code-panel .cp-label{font-size:.7rem;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.code-panel .cp-code{font-family:'Courier New',monospace;font-size:1.6rem;font-weight:700;color:var(--gold);letter-spacing:.15em;margin-bottom:10px;user-select:all;word-break:break-all}
.code-panel .cp-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.code-panel .cp-expiry{font-size:.72rem;color:var(--wn)}
.code-panel .cp-expiry.warn{color:var(--dng)}
.reschedule-badge{display:inline-block;padding:2px 8px;background:rgba(255,179,0,.12);border:1px solid rgba(255,179,0,.4);border-radius:10px;font-size:.7rem;color:var(--wn);font-weight:600;letter-spacing:.03em;margin-left:6px}
.social-wrap{display:flex;flex-direction:column;gap:18px}
.social-group-title{font-size:.7rem;color:var(--mu);letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;font-weight:600}
.social-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.social-link{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(0,184,212,.05);border:1px solid var(--l2);border-radius:8px;color:var(--tx);text-decoration:none;font-size:.82rem;font-weight:600;transition:.15s;min-height:44px;line-height:1.2}
.social-link:hover{background:rgba(0,184,212,.14);border-color:var(--cy);color:var(--cy);text-decoration:none}
.social-link .si{font-size:1.1rem;line-height:1;flex-shrink:0}
.social-link .sl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.social-gbp{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,rgba(255,213,79,.08),rgba(0,184,212,.05));border:1px solid rgba(255,213,79,.4);border-radius:8px;color:var(--gold);font-weight:700;font-size:.88rem;text-decoration:none;min-height:48px}
.social-gbp:hover{background:rgba(255,213,79,.16);border-color:var(--gold);color:#fff;text-decoration:none}
.social-gbp .si{font-size:1.3rem}
@media(max-width:480px){.social-grid{grid-template-columns:1fr 1fr}.social-link{padding:9px 10px;font-size:.76rem}.social-link .si{font-size:1rem}}
@media(max-width:360px){.social-grid{grid-template-columns:1fr}}
@media(max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 12px 60px}
  .sidebar{position:fixed;top:56px;left:0;right:0;bottom:0;z-index:40;border-radius:0;max-height:none;transform:translateX(-100%);transition:transform .22s ease;background:var(--bg2)}
  .sidebar.open{transform:translateX(0)}
  .burger{display:inline-flex;align-items:center;justify-content:center}
  .user{display:none}
}
</style>
</head>
<body>
<div class="app-root">
  <div class="topbar">
    <button class="burger" id="burger" aria-label="Menu">☰</button>
    <div class="brand">Guided Path <b>Student</b></div>
    <div class="user" id="topUser">…</div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <h4>Overview</h4>
      <button class="navbtn active" data-view="dashboard">Dashboard</button>
      <button class="navbtn" data-view="profile">Profile</button>
      <h4>Study</h4>
      <button class="navbtn" data-view="materials">Study Materials</button>
      <button class="navbtn" data-view="schedule">Schedule</button>
      <h4>Assessment</h4>
      <button class="navbtn" data-view="tests">Tests</button>
      <button class="navbtn" data-view="results">Results</button>
      <h4>Account</h4>
      <button class="navbtn" data-view="wallet">My Wallet</button>
      <button class="navbtn" data-view="password">Change Password</button>
      <button class="navbtn danger" id="logoutBtn">Sign out</button>
    </aside>
    <main class="content" id="content">
      <div class="load"><span class="spin"></span>Loading…</div>
    </main>
  </div>
</div>

<div class="tw" id="toastWrap"></div>

<script>
(function(){
'use strict';
var GPN_API_URL='https://script.google.com/macros/s/AKfycbx0dOo1ovROMdFYedx4Gm3a1tmpZjjXEwqcxLjCzWXC3Tgxupo9Mc3obk5zDS3uat_7/exec';
var K_TOKEN='gpn_token',K_ROLE='gpn_role',K_USER='gpn_user',K_NAME='gpn_name';

function getToken(){return localStorage.getItem(K_TOKEN)||'';}
function getRole(){return localStorage.getItem(K_ROLE)||'';}
function getUser(){return localStorage.getItem(K_USER)||'';}
function getName(){return localStorage.getItem(K_NAME)||'';}
function clearSession(){[K_TOKEN,K_ROLE,K_USER,K_NAME].forEach(function(k){localStorage.removeItem(k);});}

function toast(msg,kind){
  var w=document.getElementById('toastWrap');
  var el=document.createElement('div');
  el.className='tt '+(kind||'');
  el.textContent=msg;
  w.appendChild(el);
  setTimeout(function(){el.remove();},4500);
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function copyToClipboard(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast('Copied','ok');}).catch(function(){fallbackCopy(text);});
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Copied','ok');}catch(e){toast('Copy failed','error');}
  document.body.removeChild(ta);
}

async function apiCall(action,payload){
  try{
    var res=await fetch(GPN_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:action,token:getToken(),payload:payload||{}}),redirect:'follow'});
    var j=await res.json();
    if(j&&j.ok===false&&['SESSION_EXPIRED','SESSION_REVOKED','ACCOUNT_INACTIVE'].indexOf(j.code)>=0){
      clearSession();toast('Session expired. Redirecting…','error');
      setTimeout(function(){window.location.href='login.html';},1200);
    }
    return j;
  }catch(e){return {ok:false,error:'Network error.',code:'NETWORK'};}
}

/* Fire-and-forget tracking — never blocks user navigation */
function trackOpen(action,payload){
  try{
    fetch(GPN_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:action,token:getToken(),payload:payload||{}}),keepalive:true}).catch(function(){});
  }catch(e){}
}

(function guard(){
  if(!getToken()){window.location.href='login.html';return;}
  if(String(getRole()).toUpperCase()!=='STUDENT'){window.location.href='admin.html';return;}
  var u=document.getElementById('topUser');
  if(u) u.textContent='Hi, '+(getName()||getUser());
})();

var sidebar=document.getElementById('sidebar');
var burger=document.getElementById('burger');
var content=document.getElementById('content');
burger.addEventListener('click',function(){sidebar.classList.toggle('open');});

document.querySelectorAll('.navbtn[data-view]').forEach(function(b){
  b.addEventListener('click',function(){
    var v=b.getAttribute('data-view');
    document.querySelectorAll('.navbtn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    if(window.matchMedia('(max-width:900px)').matches)sidebar.classList.remove('open');
    render(v);
  });
});
document.getElementById('logoutBtn').addEventListener('click',async function(){
  await apiCall('logout');clearSession();window.location.href='login.html';
});

/* V17.1: sidebar height safety net for iframe environments */
function gpnFitSidebar() {
  try {
    var sb = document.querySelector('.sidebar');
    if (!sb) return;
    var topOffset = 72;
    var bottomBuffer = 24;
    var available = (window.innerHeight || document.documentElement.clientHeight || 700) - topOffset - bottomBuffer;
    if (available > 200 && available < 2000) {
      sb.style.maxHeight = available + 'px';
    }
  } catch (e) {}
}
window.addEventListener('load', gpnFitSidebar);
window.addEventListener('resize', gpnFitSidebar);
setInterval(gpnFitSidebar, 1500);

setInterval(function(){
  document.querySelectorAll('[data-expires]').forEach(function(el){
    var exp=el.getAttribute('data-expires');
    var t=Date.parse(exp);
    if(isNaN(t))return;
    var d=t-Date.now();
    if(d<=0){el.textContent='Expired';el.classList.add('warn');return;}
    var mins=Math.floor(d/60000);
    var secs=Math.floor((d%60000)/1000);
    if(mins>=60){
      var h=Math.floor(mins/60),m=mins%60;
      el.textContent='Expires in '+h+'h '+m+'m';
    } else if(mins>=5){
      el.textContent='Expires in '+mins+'m '+secs+'s';
    } else {
      el.textContent='Expires in '+mins+'m '+secs+'s — hurry!';
      el.classList.add('warn');
    }
  });
},1000);

function loading(){content.innerHTML='<div class="load"><span class="spin"></span>Loading…</div>';}
function errorState(m){content.innerHTML='<div class="err">'+esc(m)+'</div>';}
function emptyState(m){return '<div class="empty">'+esc(m||'Nothing here yet.')+'</div>';}
function header(t,s){return '<h2 class="stitle">'+esc(t)+'</h2>'+(s?'<p class="ssub">'+esc(s)+'</p>':'');}
function badge(t,cls){var c=cls||String(t||'').toLowerCase();return '<span class="bdg '+esc(c)+'">'+esc(t)+'</span>';}
function stat(l,v,cls){return '<div class="stat"><span class="lbl">'+esc(l)+'</span><span class="val '+(cls||'')+'">'+esc(v)+'</span></div>';}
function fmtDate(d){if(!d) return '—';return String(d).split('T')[0];}
function fmtDateTime(d){if(!d) return '—';return String(d).replace('T',' ').substring(0,19);}
function fg(label,id,type,opts){
  opts=opts||{};
  var a='';
  if(opts.required)a+=' required';
  if(opts.minlength)a+=' minlength="'+opts.minlength+'"';
  if(opts.placeholder)a+=' placeholder="'+esc(opts.placeholder)+'"';
  if(opts.value!=null)a+=' value="'+esc(opts.value)+'"';
  var full=opts.full?' style="grid-column:1/-1"':'';
  var hint=opts.hint?'<span class="hint">'+esc(opts.hint)+'</span>':'';
  if(type==='textarea')return '<div class="fg"'+full+'><label for="'+esc(id)+'">'+esc(label)+'</label><textarea id="'+esc(id)+'"'+a+'>'+esc(opts.value||'')+'</textarea>'+hint+'</div>';
  if(type==='select'){
    var o=(opts.options||[]).map(function(x){
      var v=(typeof x==='string')?x:x.value;
      var t=(typeof x==='string')?x:x.label;
      var sel=(opts.value!=null&&String(opts.value)===String(v))?' selected':'';
      return '<option value="'+esc(v)+'"'+sel+'>'+esc(t)+'</option>';
    }).join('');
    return '<div class="fg"'+full+'><label for="'+esc(id)+'">'+esc(label)+'</label><select id="'+esc(id)+'"'+a+'>'+o+'</select>'+hint+'</div>';
  }
  return '<div class="fg"'+full+'><label for="'+esc(id)+'">'+esc(label)+'</label><input id="'+esc(id)+'" type="'+esc(type)+'"'+a+'>'+hint+'</div>';
}
function val(id){var el=document.getElementById(id);return el?el.value.trim():'';}

function render(v){
  loading();
  var fn=VIEWS[v]||VIEWS.dashboard;
  Promise.resolve(fn()).catch(function(e){errorState(e&&e.message?e.message:String(e));});
}

VIEWS.dashboard=async function(){
  var rs=await Promise.all([apiCall('studentDashboard'),apiCall('studentAnnouncement'),apiCall('studentCounters'),apiCall('studentSocials')]);
  var r=rs[0],ann=rs[1],ctr=rs[2],soc=rs[3];
  if(!r.ok)return errorState(r.error||'Failed to load.');
  var d=r.data||{};
  var html='';

  if(ann.ok && ann.data && ann.data.active && ann.data.html){
    var key='gpn_announce_seen_'+String(ann.data.updated||'');
    if(localStorage.getItem(key)!=='1'){
      html+='<div class="announce" id="annBox"><button class="aclose" id="annClose" aria-label="Dismiss">×</button>'+
        '<div class="atitle">'+esc(ann.data.title||'Latest from GPN')+'</div>'+
        '<div>'+ann.data.html+'</div></div>';
    }
  }

  if(ctr.ok && ctr.data && ctr.data.counters && ctr.data.counters.length){
    html+='<div class="counter-row">';
    ctr.data.counters.forEach(function(c){
      html+='<div class="counter"><div class="icn">'+esc(c.icon||'')+'</div><div class="num">'+esc(c.value)+'</div><div class="lbl">'+esc(c.label)+'</div></div>';
    });
    html+='</div>';
  }

  if(d.recentReschedules && d.recentReschedules.length){
    html+='<div class="panel" style="border-color:rgba(255,179,0,.5);background:rgba(255,179,0,.04)">'+
      '<div class="ptitle" style="color:var(--wn)">🔄 Your schedule was updated</div>';
    d.recentReschedules.forEach(function(s){
      html+='<div class="quiet" style="color:var(--tx)">'+esc(s.Type)+' on '+esc(fmtDate(s.Date))+' at '+esc(s.StartTime)+' — please check the new time.</div>';
    });
    html+='</div>';
  }

  html+=header('Dashboard','Your GPN at a glance.');
  html+='<div class="stats">'+
    stat('Wallet','₹'+(d.walletBalance||0),'gold')+
    stat('Access',d.access||'—')+
    stat('Avg %',(d.summary&&d.summary.avg)||0)+
    stat('Tests Taken',(d.summary&&d.summary.tests)||0)+
  '</div>';

  html+='<div class="panel"><div class="ptitle">Today\'s Tasks</div>';
  if(d.todayTasks&&d.todayTasks.length){
    html+='<div class="twrap"><table class="tbl"><thead><tr><th>Time</th><th>Type</th><th>Subject</th><th>Status</th></tr></thead><tbody>';
    d.todayTasks.forEach(function(t){
      html+='<tr><td>'+esc(t.StartTime||'—')+'</td><td>'+esc(t.Type)+'</td><td>'+esc(t.SubjectID||'—')+'</td><td>'+badge(t.Status||'')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  } else html+=emptyState('No tasks scheduled for today.');
  html+='</div>';

  html+='<div class="panel"><div class="ptitle">Next Test</div>';
  if(d.nextTest){
    html+='<div class="quiet">'+esc(fmtDate(d.nextTest.Date))+' · '+esc(d.nextTest.Type)+' · '+(esc(d.nextTest.StartTime)||'—')+'</div>';
  } else html+=emptyState('No upcoming tests.');
  html+='</div>';

  if(d.recentResult){
    var rr=d.recentResult;
    html+='<div class="panel"><div class="ptitle">Most Recent Result</div>'+
      '<div>'+esc(rr.TestTitle||rr.TestID)+' — <b style="color:var(--cy)">'+esc(rr.MarksObtained)+' / '+esc(rr.MaxMarks)+'</b> ('+esc(rr.Percentage)+'%)</div>'+
    '</div>';
  }

  if(d.remarks&&d.remarks.length){
    html+='<div class="panel"><div class="ptitle">Recent Remarks</div>';
    d.remarks.forEach(function(x){
      html+='<div style="margin-bottom:8px">'+esc(x.Text)+' <span class="quiet" style="font-size:.75rem">· '+esc(fmtDate(x.CreatedDate))+'</span></div>';
    });
    html+='</div>';
  }

  html+='<div class="panel"><div class="ptitle">Need Help?</div>'+
    '<div class="help-box">Reach us on WhatsApp for any issue — questions, payments, tests, or account problems.<br><br>'+
    '<a href="https://wa.me/guidedpathnoida" target="_blank" rel="noopener">💬 Contact us on WhatsApp (AI enabled)</a></div></div>';

  if(soc.ok && soc.data){
    var sd=soc.data||{};
    var links=sd.links||[];
    var gbp=sd.gbp||'';
    if(links.length||gbp){
      html+='<div class="panel"><div class="ptitle">Connect with GPN</div><div class="social-wrap">';
      var groups={connect:[],watch:[],chat:[],more:[]};
      links.forEach(function(l){
        var g=String(l.group||'more').toLowerCase();
        if(!groups[g])groups[g]=[];
        groups[g].push(l);
      });
      function renderGroup(title,arr){
        if(!arr.length)return '';
        var h='<div><div class="social-group-title">'+esc(title)+'</div><div class="social-grid">';
        arr.forEach(function(l){
          h+='<a class="social-link" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+
             '<span class="si">'+esc(l.icon||'🔗')+'</span>'+
             '<span class="sl">'+esc(l.label)+'</span></a>';
        });
        h+='</div></div>';
        return h;
      }
      html+=renderGroup('Connect',groups.connect);
      html+=renderGroup('Watch',groups.watch);
      html+=renderGroup('Chat with us',groups.chat);
      if(gbp){
        html+='<div><div class="social-group-title">Reviews &amp; Ratings</div>'+
          '<a class="social-gbp" href="'+esc(gbp)+'" target="_blank" rel="noopener">'+
          '<span class="si">⭐</span><span>Rate us on Google Business</span></a></div>';
      }
      html+=renderGroup('More',groups.more);
      html+='</div></div>';
    }
  }

  content.innerHTML=html;

  var ac=document.getElementById('annClose');
  if(ac)ac.addEventListener('click',function(){
    localStorage.setItem('gpn_announce_seen_'+String((ann.data&&ann.data.updated)||''),'1');
    var ab=document.getElementById('annBox');if(ab)ab.remove();
  });
};

/* ========== MATERIALS ========== */
var _matState={type:'ALL',search:''};
VIEWS.materials=async function(){
  var r=await apiCall('studentMaterials');
  if(!r.ok)return errorState(r.error||'Failed to load.');
  var mats=(r.data&&r.data.materials)||[];
  if(!mats.length){
    content.innerHTML=header('Study Materials','Notes, solutions, worksheets and videos assigned to you.')+emptyState('No materials assigned yet.');
    return;
  }
  var html=header('Study Materials','Notes, solutions, worksheets and videos assigned to you.');
  html+='<div class="mat-toolbar">'+
    '<input type="text" class="search-input" id="matSearch" placeholder="🔍 Search by title or chapter…" value="'+esc(_matState.search)+'">'+
  '</div>';
  html+='<div class="mat-toolbar" id="matChips"></div>';
  html+='<div id="matList"></div>';
  content.innerHTML=html;

  var types=['ALL','NOTES','SOLUTION','WORKSHEET','VIDEO','OTHER'];
  var chipsEl=document.getElementById('matChips');
  chipsEl.innerHTML=types.map(function(t){
    return '<button class="chip'+(t===_matState.type?' active':'')+'" data-type="'+t+'">'+t.charAt(0)+t.slice(1).toLowerCase()+'</button>';
  }).join('');
  chipsEl.querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click',function(){
      _matState.type=b.getAttribute('data-type');
      chipsEl.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      renderMatList(mats);
    });
  });
  document.getElementById('matSearch').addEventListener('input',function(e){
    _matState.search=e.target.value.toLowerCase();
    renderMatList(mats);
  });
  renderMatList(mats);
};

function renderMatList(mats){
  var list=document.getElementById('matList');
  if(!list)return;
  var filtered=mats.filter(function(m){
    if(_matState.type!=='ALL' && String(m.Type)!==_matState.type) return false;
    if(_matState.search){
      var hay=(String(m.Title)+' '+String(m.SubjectName||'')+' '+String(m.ChapterName||'')).toLowerCase();
      if(hay.indexOf(_matState.search)<0) return false;
    }
    return true;
  });
  if(!filtered.length){
    list.innerHTML='<div class="empty">No materials match your filter.</div>';
    return;
  }
  var groups={};
  filtered.forEach(function(m){
    var skey=m.SubjectName||m.SubjectID||'Other Subjects';
    var ckey=m.ChapterName||m.ChapterID||'General';
    if(!groups[skey])groups[skey]={};
    if(!groups[skey][ckey])groups[skey][ckey]=[];
    groups[skey][ckey].push(m);
  });
  var html='';
  Object.keys(groups).sort().forEach(function(subj){
    var chapters=groups[subj];
    var total=Object.keys(chapters).reduce(function(s,c){return s+chapters[c].length;},0);
    html+='<div class="mat-group"><div class="mat-group-hd">'+
      '<span class="sg-title">📚 '+esc(subj)+'</span>'+
      '<span class="sg-count">'+total+' item'+(total===1?'':'s')+'</span>'+
    '</div>';
    Object.keys(chapters).sort().forEach(function(chap){
      var items=chapters[chap];
      html+='<div style="font-size:.78rem;color:var(--cy);margin:10px 0 6px;letter-spacing:.05em">▸ '+esc(chap)+'</div>';
      items.forEach(function(m){
        var viewBtn = m.ViewURL
          ? '<a class="btn ghost sm" href="'+esc(m.ViewURL)+'" target="_blank" rel="noopener" data-mat-view="'+esc(m.MaterialID)+'">👁 View</a>'
          : '';
        var dlBtn = m.DownloadURL
          ? '<a class="btn gold sm" href="'+esc(m.DownloadURL)+'" target="_blank" rel="noopener" data-mat-dl="'+esc(m.MaterialID)+'">⬇ Download</a>'
          : '';
        html+='<div class="mat-card">'+
          '<div>'+
            '<div class="mt-title">'+esc(m.Title)+'</div>'+
            '<div class="mt-meta">'+badge(m.Type||'OTHER',String(m.Type||'other').toLowerCase())+(m.Description?' · '+esc(m.Description):'')+'</div>'+
          '</div>'+
          '<div class="mt-actions">'+viewBtn+dlBtn+'</div>'+
        '</div>';
      });
    });
    html+='</div>';
  });
  list.innerHTML=html;
  list.querySelectorAll('a[data-mat-view]').forEach(function(a){
    a.addEventListener('click',function(){ trackOpen('studentOpenMaterial',{materialId:a.getAttribute('data-mat-view')}); });
  });
  list.querySelectorAll('a[data-mat-dl]').forEach(function(a){
    a.addEventListener('click',function(){ trackOpen('studentOpenMaterial',{materialId:a.getAttribute('data-mat-dl')}); });
  });
}

/* ========== TESTS ========== */
VIEWS.tests=async function(){
  var r=await apiCall('studentTests');
  if(!r.ok)return errorState(r.error||'Failed to load.');
  var list=(r.data&&r.data.tests)||[];
  var wallet=Number((r.data&&r.data.walletBalance)||0);
  var html=header('Tests','Available and completed assessments.');
  html+='<div class="stats">'+stat('Wallet Balance','₹'+wallet,'gold')+'</div>';
  if(!list.length){content.innerHTML=html+emptyState('No tests assigned.');return;}

  list.forEach(function(it){
    var t=it.test||{},a=it.attempt,res=it.result,s=it.schedule;
    var status=String(t.Status||'').toUpperCase();
    var price=Number(t.Price||0);
    var activeAttempt=a && String(a.Status)==='ISSUED' && a.Code && a.ExpiresAt;
    var formUrl = t.FormURL || '';

    html+='<div class="test-card">'+
      '<div class="tname">'+esc(t.Title)+' '+badge(status)+(s&&String(s.UpdateReason)==='Rescheduled'?'<span class="reschedule-badge">🔄 Rescheduled</span>':'')+'</div>'+
      '<div class="tmeta">Marks: '+esc(t.TotalMarks)+' · Duration: '+esc(t.Duration)+' min · Cost: ₹'+price+
        (s?' · Scheduled: '+esc(fmtDate(s.Date))+' '+(esc(s.StartTime)||''):'')+'</div>';

    if(res){
      html+='<div>Result: <b style="color:var(--cy)">'+esc(res.MarksObtained)+' / '+esc(res.MaxMarks)+' ('+esc(res.Percentage)+'%)</b></div>';
    } else if(activeAttempt){
      html+='<div class="code-panel">'+
        '<div class="cp-label">Your Submission Code</div>'+
        '<div class="cp-code" id="code_'+esc(a.AttemptID)+'">'+esc(a.Code)+'</div>'+
        '<div class="cp-actions">'+
          '<button class="btn gold sm" data-copy="'+esc(a.Code)+'">📋 Copy Code</button>'+
          (formUrl?'<a class="btn sm" href="'+esc(formUrl)+'" target="_blank" rel="noopener">🔗 Open Google Form</a>':'')+
        '</div>'+
        '<div class="cp-expiry" data-expires="'+esc(a.ExpiresAt)+'">Calculating…</div>'+
        '<div class="hint" style="margin-top:6px">Copy the code, open the form, paste it into the "Submission Code" field, then answer the questions and submit.</div>'+
      '</div>';
    } else if(a && a.Status==='SUBMITTED'){
      html+='<div class="quiet">Submitted. Awaiting teacher evaluation.</div>';
    } else if(a && a.Status==='EVALUATED'){
      html+='<div class="quiet">Evaluated. Awaiting publication.</div>';
    } else if(a && a.Status==='EXPIRED'){
      html+='<div class="quiet">Your previous attempt expired. '+(status==='AVAILABLE'?'You may try again in the second window.':'')+'</div>';
    } else if(status==='AVAILABLE'){
      if(price>0 && wallet<price){
        var shortfall=price-wallet;
        html+='<div class="quiet" style="color:var(--dng);margin-bottom:8px">Wallet short by ₹'+shortfall+'.</div>'+
          '<a class="btn gold" href="https://www.guidedpathnoida.in/fees" target="_blank" rel="noopener">Pay ₹'+shortfall+' via UPI</a>';
      } else {
        html+='<div class="tactions"><button class="btn gold" data-start="'+esc(t.TestID)+'">Start Test'+(price>0?' (₹'+price+')':'')+'</button></div>';
      }
    } else if(status==='DRAFT'){
      html+='<div class="quiet">Not yet available.</div>';
    } else if(status==='CLOSED'){
      html+='<div class="quiet">This test is closed.</div>';
    } else if(status==='EVALUATED'||status==='PUBLISHED'){
      html+='<div class="quiet">Test completed.</div>';
    }
    html+='</div>';
  });
  content.innerHTML=html;

  content.querySelectorAll('button[data-copy]').forEach(function(b){
    b.addEventListener('click',function(){copyToClipboard(b.getAttribute('data-copy'));});
  });

  content.querySelectorAll('button[data-start]').forEach(function(b){
    b.addEventListener('click',async function(){
      var tid=b.getAttribute('data-start');
      b.disabled=true;b.textContent='Issuing…';
      var r2=await apiCall('studentStartTest',{testId:tid});
      b.disabled=false;b.textContent='Start Test';
      if(!r2.ok){
        var msg=r2.error||'Cannot start.';
        if(r2.code==='NOT_YET_OPEN')msg='This test opens at '+((r2.data&&r2.data.nextOpenAt)||'a later time')+'.';
        if(r2.code==='BETWEEN_WINDOWS')msg='First window ended. Second window opens at '+((r2.data&&r2.data.nextOpenAt)||'')+'.';
        if(r2.code==='WINDOW_CLOSED')msg='The test window has closed.';
        if(r2.code==='ALREADY_SUBMITTED')msg='You already submitted this test.';
        if(r2.code==='INSUFFICIENT_BALANCE'){
          var p=(r2.data&&r2.data.paymentUrl)||'https://www.guidedpathnoida.in/fees';
          msg='Insufficient wallet balance. Shortfall: ₹'+((r2.data&&r2.data.shortfall)||0)+'. Open payment page?';
          if(confirm(msg)){window.open(p,'_blank','noopener');return;}
          return;
        }
        return toast(msg,'error');
      }
      toast('Code issued. Copy it into the Google Form.','ok');
      render('tests');
    });
  });
};

  html+='<div class="panel"><div class="ptitle">How to add money</div>'+
    '<div class="quiet" style="margin-bottom:10px">Send payment via UPI to the GPN account, then message us the screenshot on WhatsApp. Your wallet will be credited after verification.</div>'+
    '<a class="btn gold" href="https://www.guidedpathnoida.in/fees" target="_blank" rel="noopener">Open Payment Page</a> '+
    '<a class="btn" href="https://wa.me/guidedpathnoida" target="_blank" rel="noopener">Contact on WhatsApp</a>'+
  '</div>';
  html+='<div class="panel"><div class="ptitle">Transaction History</div>';
  if(!hist.length)html+=emptyState('No transactions yet.');
  else{
    html+='<div class="twrap"><table class="tbl"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Balance</th><th>Notes</th></tr></thead><tbody>';
    hist.forEach(function(h){
      var amt=Number(h.Amount||0);
      var color=amt>0?'#4caf50':'#ff6b6b';
      var sign=amt>0?'+':'';
      html+='<tr>'+
        '<td>'+esc(fmtDateTime(h.EntryDate))+'</td>'+
        '<td>'+badge(h.Type||'',String(h.Type||'').toLowerCase())+'</td>'+
        '<td style="color:'+color+';font-weight:700">'+sign+'₹'+Math.abs(amt)+'</td>'+
        '<td>₹'+esc(h.BalanceAfter||0)+'</td>'+
        '<td class="wrap">'+esc(h.Notes||'')+'</td>'+
      '</tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';
  content.innerHTML=html;
};

/* ========== PASSWORD ========== */
VIEWS.password=async function(){
  var html=header('Change Password','You will be signed out after changing.');
  html+='<div class="panel"><div class="fgrid">'+
    fg('New Password','np_new','password',{required:true,minlength:6,hint:'Minimum 6 characters.'})+
    fg('Confirm New Password','np_conf','password',{required:true,minlength:6})+
  '</div><div class="arow mt16"><button class="btn gold" id="np_go">Change Password</button></div></div>';
  content.innerHTML=html;
  document.getElementById('np_go').addEventListener('click',async function(){
    var a=val('np_new'),b=val('np_conf');
    if(a.length<6)return toast('Password must be at least 6 characters.','error');
    if(a!==b)return toast('Passwords do not match.','error');
    var r=await apiCall('studentPasswordChange',{newPassword:a});
    if(!r.ok)return toast(r.error||'Failed.','error');
    toast('Password changed. Please log in again.','ok');
    clearSession();
    setTimeout(function(){window.location.href='login.html';},1200);
  });
};

render('dashboard');
})();
</script>
