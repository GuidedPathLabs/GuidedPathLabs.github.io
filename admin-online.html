<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a192f">
  <meta name="robots" content="noindex,nofollow">
  <title>Online Management — GPN Admin</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="shared/gpn.css?v=1.0.0">
</head>
<body>

<div class="gpn-page-loading" id="pageLoading">
  <div class="gpn-spinner"></div>
  <div>Loading…</div>
</div>

<div class="gpn-app" hidden id="appRoot">

  <header class="gpn-topbar">
    <div class="gpn-topbar-brand">
      <div class="gpn-brand-mark">GPN</div>
      <div class="gpn-brand-name">Online <b>Management</b></div>
    </div>
    <div class="gpn-topbar-user">
      <span class="gpn-user-badge" id="userBadge">—</span>
      <button class="gpn-btn gpn-btn-ghost gpn-btn-sm" id="btnLogout" type="button">Logout</button>
    </div>
  </header>

  <nav class="gpn-navstrip">
    <a class="gpn-navstrip-btn" href="admin.html">Overview</a>
    <a class="gpn-navstrip-btn active" href="admin-online.html">Online</a>
    <a class="gpn-navstrip-btn" href="admin-offline.html">Offline</a>
    <a class="gpn-navstrip-btn" href="admin-master.html">Master</a>
    <a class="gpn-navstrip-btn" href="admin-automation.html">Automation</a>
    <a class="gpn-navstrip-btn" href="admin-estore.html">E-Store</a>
    <a class="gpn-navstrip-btn" href="admin-reports.html">Reports</a>
    <a class="gpn-navstrip-btn" href="admin-settings.html">Settings</a>
  </nav>

  <main class="gpn-main">

    <div class="gpn-chips" id="subTabs">
      <button class="gpn-chip active" data-view="overview">Overview</button>
      <button class="gpn-chip" data-view="students">Students</button>
      <button class="gpn-chip" data-view="programmes">Programmes</button>
      <button class="gpn-chip" data-view="subjects">Subjects</button>
      <button class="gpn-chip" data-view="chapters">Chapters</button>
      <button class="gpn-chip" data-view="enrolments">Enrolments</button>
      <button class="gpn-chip" data-view="materials">Materials</button>
      <button class="gpn-chip" data-view="schedule">Schedule</button>
      <button class="gpn-chip" data-view="tests">Tests</button>
      <button class="gpn-chip" data-view="evaluations">Evaluations</button>
      <button class="gpn-chip" data-view="results">Results</button>
      <button class="gpn-chip" data-view="payments">Payments</button>
      <button class="gpn-chip" data-view="content">Content</button>
    </div>

    <div id="viewRoot">
      <div class="gpn-loading"><span class="gpn-spinner"></span> Loading…</div>
    </div>

  </main>
</div>

<div class="gpn-modal" id="modalGeneric" hidden>
  <div class="gpn-modal-card" id="modalGenericCard"></div>
</div>

<script src="shared/config.js?v=1.0.0"></script>
<script src="shared/gpn.js?v=1.0.0"></script>
<script>
(function () {
  'use strict';

  if (!GPN.Guard.requireAdmin()) return;

  var viewRoot = null;
  var appRoot  = null;

  GPN.ready(function () {
    appRoot  = GPN.byId('appRoot');
    viewRoot = GPN.byId('viewRoot');

    GPN.byId('userBadge').textContent = GPN.Session.getName() || 'Admin';
    GPN.byId('userBadge').title = GPN.Session.getUser() || '';

    GPN.$$('#subTabs .gpn-chip').forEach(function (btn) {
      GPN.on(btn, 'click', function () {
        GPN.$$('#subTabs .gpn-chip').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        render(btn.dataset.view);
      });
    });

    GPN.on(GPN.byId('btnLogout'), 'click', function () {
      if (confirm('Sign out?')) GPN.Guard.logout();
    });

    GPN.Modal.wire('modalGeneric');

    appRoot.hidden = false;
    GPN.byId('pageLoading').hidden = true;

    render('overview');
  });

  function render(view) {
    GPN.showContainerLoading(viewRoot, 'Loading…');
    var fn = VIEWS[view] || VIEWS.overview;
    Promise.resolve(fn()).catch(function (err) {
      console.error(view, err);
      GPN.showContainerError(viewRoot, 'Failed to load.');
    });
  }

  function openModal(html, onReady) {
    var card = GPN.byId('modalGenericCard');
    card.innerHTML = html;
    GPN.Modal.open('modalGeneric');
    if (typeof onReady === 'function') setTimeout(onReady, 20);
  }
  function closeModal() { GPN.Modal.close('modalGeneric'); }

  var cacheProgrammes = null;
  var cacheSubjects = null;
  var cacheChapters = null;

  function loadProgrammes(force) {
    if (cacheProgrammes && !force) return Promise.resolve(cacheProgrammes);
    return GPN.api('adminListProgrammes').then(function (j) {
      cacheProgrammes = (j.ok && j.data && j.data.programmes) || [];
      return cacheProgrammes;
    });
  }
  function loadSubjects(force) {
    if (cacheSubjects && !force) return Promise.resolve(cacheSubjects);
    return GPN.api('adminListSubjects').then(function (j) {
      cacheSubjects = (j.ok && j.data && j.data.subjects) || [];
      return cacheSubjects;
    });
  }
  function loadChapters(force) {
    if (cacheChapters && !force) return Promise.resolve(cacheChapters);
    return GPN.api('adminListChapters').then(function (j) {
      cacheChapters = (j.ok && j.data && j.data.chapters) || [];
      return cacheChapters;
    });
  }
  function invalidateCaches() {
    cacheProgrammes = null; cacheSubjects = null; cacheChapters = null;
  }

  function esc(s) { return GPN.esc(s); }
  function fmtDate(d) { return GPN.formatDate(d); }
  function fmtDT(d) { return GPN.formatDateTime(d); }
  function fmtCur(n) { return GPN.formatCurrency(n); }
  function pill(text, tone) {
    var cls = tone || String(text || '').toLowerCase().replace(/[^a-z]/g, '');
    return '<span class="gpn-pill ' + esc(cls) + '">' + esc(text) + '</span>';
  }
  function optRow(name, id) { return { value: id, label: name + ' (' + id + ')' }; }

  var VIEWS = {};

  VIEWS.overview = function () {
    return GPN.api('adminOnlineOverview').then(function (j) {
      if (!j.ok) { GPN.showContainerError(viewRoot, GPN.friendlyError(j)); return; }
      var d = j.data || {};
      viewRoot.innerHTML =
        '<div class="gpn-stats">' +
          statCard('Total Students', d.totalStudents || 0) +
          statCard('Active', d.activeStudents || 0, 'green') +
          statCard('Suspended', d.suspendedStudents || 0, 'error') +
          statCard('Active Programmes', d.activeProgrammes || 0, 'gold') +
          statCard('Tests Today', d.testsToday || 0) +
          statCard('Tests This Week', d.testsThisWeek || 0) +
          statCard('Pending Evals', d.pendingEvaluations || 0, 'warn') +
          statCard('Pending Publishes', d.pendingPublications || 0, 'warn') +
          statCard('Total Wallet', fmtCur(d.totalWalletBalance || 0), 'gold') +
        '</div>' +
        '<div class="gpn-card"><div class="gpn-card-head"><h3 class="gpn-card-title">Quick Actions</h3></div>' +
        '<div class="gpn-card-body"><div class="gpn-row">' +
          '<button class="gpn-btn gpn-btn-cyan" onclick="document.querySelector(\'#subTabs button[data-view=students]\').click()">+ Add Student</button>' +
          '<button class="gpn-btn gpn-btn-cyan" onclick="document.querySelector(\'#subTabs button[data-view=tests]\').click()">+ Create Test</button>' +
          '<button class="gpn-btn gpn-btn-cyan" onclick="document.querySelector(\'#subTabs button[data-view=payments]\').click()">+ Record Payment</button>' +
        '</div></div></div>';
    });
  };
  function statCard(label, value, tone) {
    return '<div class="gpn-stat"><span class="gpn-stat-label">' + esc(label) + '</span><span class="gpn-stat-value ' + (tone || '') + '">' + esc(String(value)) + '</span></div>';
  }

  VIEWS.students = function () {
    return GPN.api('adminListStudents').then(function (j) {
      if (!j.ok) { GPN.showContainerError(viewRoot, GPN.friendlyError(j)); return; }
      var rows = (j.data && j.data.students) || [];

      var html = '';
      html += '<div class="gpn-card"><div class="gpn-card-head">';
      html += '<h3 class="gpn-card-title">Students (' + rows.length + ')</h3>';
      html += '<button class="gpn-btn gpn-btn-primary gpn-btn-sm" id="btnAddStudent">+ Add Student</button>';
      html += '</div><div class="gpn-card-body">';
      html += '<input class="gpn-search" id="studentSearch" placeholder="Search by name, ID, phone…" style="margin-bottom:12px;">';
      html += '</div>';

      if (!rows.length) {
        html += '<div class="gpn-card-body"><div class="gpn-empty-state">No students yet.</div></div>';
      } else {
        html += '<div class="gpn-table-wrap" style="border:none;border-radius:0;">';
        html += '<table class="gpn-table"><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Phone</th><th>Wallet</th><th>Access</th><th>Status</th><th></th></tr></thead><tbody id="studentRows">';
        rows.forEach(function (s) {
          html += studentRow(s);
        });
        html += '</tbody></table></div>';
      }
      html += '</div>';

      viewRoot.innerHTML = html;

      GPN.on(GPN.byId('btnAddStudent'), 'click', addStudentModal);

      var search = GPN.byId('studentSearch');
      if (search) {
        GPN.on(search, 'input', GPN.debounce(function () {
          var q = search.value.toLowerCase().trim();
          GPN.$$('#studentRows tr').forEach(function (tr) {
            var hay = (tr.dataset.search || '').toLowerCase();
            tr.style.display = (!q || hay.indexOf(q) >= 0) ? '' : 'none';
          });
        }, 150));
      }

      GPN.$$('#studentRows button[data-act]').forEach(function (btn) {
        GPN.on(btn, 'click', function () {
          var id = btn.dataset.id;
          var act = btn.dataset.act;
          if (act === 'view')     viewStudent(id);
          if (act === 'wallet')   walletModal(id);
          if (act === 'edit')     editStudentModal(id);
          if (act === 'password') resetPasswordModal(id);
          if (act === 'delete')   deleteStudent(id);
        });
      });
    });
  };

  function studentRow(s) {
    var search = [s.Name, s.StudentID, s.Phone, s.Email].join(' ').toLowerCase();
    return '<tr data-search="' + esc(search) + '">' +
      '<td data-label="ID" class="gpn-mono">' + esc(s.StudentID) + '</td>' +
      '<td data-label="Name">' + esc(s.Name) + '</td>' +
      '<td data-label="Class">' + esc(s.Class || '—') + '</td>' +
      '<td data-label="Phone">' + esc(s.Phone || '—') + '</td>' +
      '<td data-label="Wallet" style="color:var(--gold);font-weight:700;">' + fmtCur(s.Wallet || 0) + '</td>' +
      '<td data-label="Access">' + pill(s.Access || 'NONE') + '</td>' +
      '<td data-label="Status">' + pill(s.Status || '—') + '</td>' +
      '<td data-label="Actions">' +
        '<button class="gpn-btn gpn-btn-ghost gpn-btn-sm" data-act="view" data-id="' + esc(s.StudentID) + '">View</button> ' +
        '<button class="gpn-btn gpn-btn-ghost gpn-btn-sm" data-act="wallet" data-id="' + esc(s.StudentID) + '">Wallet</button> ' +
        '<button class="gpn-btn gpn-btn-ghost gpn-btn-sm" data-act="edit" data-id="' + esc(s.StudentID) + '">Edit</button> ' +
        '<button class="gpn-btn gpn-btn-ghost gpn-btn-sm" data-act="password" data-id="' + esc(s.StudentID) + '">Reset PW</button> ' +
        '<button class="gpn-btn gpn-btn-danger gpn-btn-sm" data-act="delete" data-id="' + esc(s.StudentID) + '">Delete</button>' +
      '</td>' +
    '</tr>';
  }

  function addStudentModal() {
    var html =
      '<h3 class="gpn-modal-title">Add Online Student</h3>' +
      '<p class="gpn-modal-sub">ID format: ol-&lt;firstname&gt;&lt;serial&gt;. Password defaults to phone digits.</p>' +
      '<div class="gpn-field"><label class="gpn-label">Student ID</label><input id="nsId" class="gpn-input" placeholder="ol-arnav042"></div>' +
      '<div class="gpn-field"><label class="gpn-label">Name</label><input id="nsName" class="gpn-input"></div>' +
      '<div class="gpn-grid-2">' +
        '<div class="gpn-field"><label class="gpn-label">Class</label>' + classSelect('nsClass') + '</div>' +
        '<div class="gpn-field"><label class="gpn-label">Board</label>' + boardSelect('nsBoard') + '</div>' +
      '</div>' +
      '<div class="gpn-grid-2">' +
        '<div class="gpn-field"><label class="gpn-label">Phone</label><input id="nsPhone" class="gpn-input" inputmode="tel"><span class="gpn-hint">This becomes the default password.</span></div>' +
        '<div class="gpn-field"><label class="gpn-label">WhatsApp</label><input id="nsWa" class="gpn-input" inputmode="tel" placeholder="Defaults to phone"></div>' +
      '</div>' +
      '<div class="gpn-field"><label class="gpn-label">Email</label><input id="nsEmail" class="gpn-input" inputmode="email"></div>' +
      '<div class="gpn-field"><label class="gpn-label">School</label><input id="nsSchool" class="gpn-input"></div>' +
      '<div class="gpn-field"><label class="gpn-label">Parent Name</label><input id="nsParent" class="gpn-input" placeholder="Optional"></div>' +

      '<div class="gpn-card" style="margin-top:14px;"><div class="gpn-card-head"><h3 class="gpn-card-title">Parent Account</h3></div>' +
      '<div class="gpn-card-body">' +
        '<div class="gpn-field"><label class="gpn-check"><input type="checkbox" id="nsCreateParent"> <span>Also create a parent login for this student</span></label></div>' +
        '<div id="nsParentFields" style="display:none;margin-top:12px;">' +
          '<div class="gpn-field"><label class="gpn-label">Parent Name</label><input id="nsParentName" class="gpn-input" placeholder="Auto-filled from student parent name if blank"></div>' +
          '<div class="gpn-grid-2">' +
            '<div class="gpn-field"><label class="gpn-label">Parent Phone</label><input id="nsParentPhone" class="gpn-input" inputmode="tel" placeholder="Defaults to student phone"><span class="gpn-hint">Becomes the parent\'s default password.</span></div>' +
            '<div class="gpn-field"><label class="gpn-label">Parent Email</label><input id="nsParentEmail" class="gpn-input" inputmode="email" placeholder="Optional"></div>' +
          '</div>' +
          '<div class="gpn-quiet" style="font-size:0.75rem;">Parent will get a pr- ID and default password = parent phone digits.</div>' +
        '</div>' +
      '</div></div>' +

      '<div id="nsError" class="gpn-alert gpn-alert-error" hidden style="margin-top:12px;"></div>' +
      '<div class="gpn-modal-actions">' +
        '<button class="gpn-btn gpn-btn-ghost" id="nsCancel">Cancel</button>' +
        '<button class="gpn-btn gpn-btn-cyan" id="nsSave">Create</button>' +
      '</div>';

    openModal(html, function () {
      var cb = GPN.byId('nsCreateParent');
      var fields = GPN.byId('nsParentFields');
      GPN.on(cb, 'change', function () {
        fields.style.display = cb.checked ? '' : 'none';
        if (cb.checked) {
          var pn = GPN.byId('nsParentName');
          var pp = GPN.byId('nsParentPhone');
          if (!pn.value) pn.value = GPN.byId('nsParent').value.trim();
          if (!pp.value) pp.value = GPN.byId('nsPhone').value.trim();
        }
      });

      GPN.on(GPN.byId('nsCancel'), 'click', closeModal);
      GPN.on(GPN.byId('nsSave'), 'click', function () {
        var err = GPN.byId('nsError');
        err.hidden = true;

        var phone = GPN.byId('nsPhone').value.trim();
        if (!phone) { err.textContent = 'Phone required (used as default password).'; err.hidden = false; return; }

        var wantParent = cb.checked;
        var pName = GPN.byId('nsParentName').value.trim();
        var pPhone = GPN.byId('nsParentPhone').value.trim();
        var pEmail = GPN.byId('nsParentEmail').value.trim();

        if (wantParent && !pPhone) {
          err.textContent = 'Parent phone required (used as parent default password).';
          err.hidden = false; return;
        }

        var payload = {
          StudentID: GPN.byId('nsId').value.trim().toLowerCase(),
          Name: GPN.byId('nsName').value.trim(),
          Class: GPN.byId('nsClass').value,
          Board: GPN.byId('nsBoard').value,
          Phone: phone,
          WhatsApp: GPN.byId('nsWa').value.trim(),
          Email: GPN.byId('nsEmail').value.trim(),
          School: GPN.byId('nsSchool').value.trim(),
          ParentName: GPN.byId('nsParent').value.trim(),
          AlsoCreateParent: wantParent,
          ParentName: pName || GPN.byId('nsParent').value.trim(),
          ParentPhone: pPhone,
          ParentEmail: pEmail
        };

        if (!payload.StudentID || !payload.Name) {
          err.textContent = 'ID and Name required.';
          err.hidden = false;
          return;
        }
        if (!/^ol-[a-z0-9]{2,20}$/.test(payload.StudentID)) {
          err.textContent = 'ID must be ol-<firstname><serial>.';
          err.hidden = false;
          return;
        }

        var btn = GPN.byId('nsSave');
        GPN.setLoading(btn, true, 'Creating…');
        GPN.api('adminCreateStudent', payload).then(function (r) {
          GPN.setLoading(btn, false);
          if (!r.ok) { err.textContent = GPN.friendlyError(r); err.hidden = false; return; }

          var msg = 'Student: ' + r.data.StudentID + ' · PW: ' + r.data.DefaultPassword;
          if (r.data.Parent && r.data.Parent.ParentID) {
            msg += ' · Parent: ' + r.data.Parent.ParentID + ' · PW: ' + r.data.Parent.DefaultPassword;
          }
          GPN.Toast.ok(msg);
          closeModal();
          render('students');
        });
      });
    });
  }

  function editStudentModal(id) {
    GPN.api('adminGetStudent', { id: id }).then(function (j) {
      if (!j.ok || !j.data || !j.data.student) { GPN.Toast.error('Student not found.'); return; }
      var s = j.data.student;

      var html =
        '<h3 class="gpn-modal-title">Edit ' + esc(s.Name) + '</h3>' +
        '<div class="gpn-field"><label class="gpn-label">Name</label><input id="esName" class="gpn-input" value="' + esc(s.Name) + '"></div>' +
        '<div class="gpn-grid-2">' +
          '<div class="gpn-field"><label class="gpn-label">Class</label>' + classSelect('esClass', s.Class) + '</div>' +
          '<div class="gpn-field"><label class="gpn-label">Board</label>' + boardSelect('esBoard', s.Board) + '</div>' +
        '</div>' +
        '<div class="gpn-grid-2">' +
          '<div class="gpn-field"><label class="gpn-label">Phone</label><input id="esPhone" class="gpn-input" value="' + esc(s.Phone || '') + '"></div>' +
          '<div class="gpn-field"><label class="gpn-label">WhatsApp</label><input id="esWa" class="gpn-input" value="' + esc(s.WhatsApp || '') + '"></div>' +
        '</div>' +
        '<div class="gpn-field"><label class="gpn-label">Email</label><input id="esEmail" class="gpn-input" value="' + esc(s.Email || '') + '"></div>' +
        '<div class="gpn-field"><label class="gpn-label">School</label><input id="esSchool" class="gpn-input" value="' + esc(s.School || '') + '"></div>' +
        '<div class="gpn-field"><label class="gpn-label">Parent Name</label><input id="esParent" class="gpn-input" value="' + esc(s.ParentName || '') + '"></div>' +
        '<div class="gpn-field"><label class="gpn-label">Status</label>' +
          '<select id="esStatus" class="gpn-select">' +
            ['ACTIVE','SUSPENDED','INACTIVE'].map(function (x) {
              return '<option value="' + x + '"' + (String(s.Status).toUpperCase() === x ? ' selected' : '') + '>' + x + '</option>';
            }).join('') +
          '</select></div>' +
        '<div id="esError" class="gpn-alert gpn-alert-error" hidden></div>' +
        '<div class="gpn-modal-actions">' +
          '<button class="gpn-btn gpn-btn-ghost" id="esCancel">Cancel</button>' +
          '<button class="gpn-btn gpn-btn-cyan" id="esSave">Save</button>' +
        '</div>';

      openModal(html, function () {
        GPN.on(GPN.byId('esCancel'), 'click', closeModal);
        GPN.on(GPN.byId('esSave'), 'click', function () {
          var err = GPN.byId('esError');
          err.hidden = true;
          var patch = {
            Name: GPN.byId('esName').value.trim(),
            Class: GPN.byId('esClass').value,
            Board: GPN.byId('esBoard').value,
            Phone: GPN.byId('esPhone').value.trim(),
            WhatsApp: GPN.byId('esWa').value.trim(),
            Email: GPN.byId('esEmail').value.trim(),
            School: GPN.byId('esSchool').value.trim(),
            ParentName: GPN.byId('esParent').value.trim(),
            Status: GPN.byId('esStatus').value
          };
          var btn = GPN.byId('esSave');
          GPN.setLoading(btn, true, 'Saving…');
          GPN.api('adminUpdateStudent', { id: id, patch: patch }).then(function (r) {
            GPN.setLoading(btn, false);
            if (!r.ok) { err.textContent = GPN.friendlyError(r); err.hidden = false; return; }
            GPN.Toast.ok('Student updated.');
            closeModal(); render('students');
          });
        });
      });
    });
  }

  function resetPasswordModal(id) {
    var html =
      '<h3 class="gpn-modal-title">Reset Password</h3>' +
      '<p class="gpn-modal-sub">Student sessions will be revoked. They must log in with the new password.</p>' +
      '<div class="gpn-field"><label class="gpn-label">New Password (min 10)</label><input id="rpNew" class="gpn-input" type="password"></div>' +
      '<div id="rpError" class="gpn-alert gpn-alert-error" hidden></div>' +
      '<div class="gpn-modal-actions">' +
        '<button class="gpn-btn gpn-btn-ghost" id="rpCancel">Cancel</button>' +
        '<button class="gpn-btn gpn-btn-danger" id="rpSave">Reset</button>' +
      '</div>';
    openModal(html, function () {
      GPN.on(GPN.byId('rpCancel'), 'click', closeModal);
      GPN.on(GPN.byId('rpSave'), 'click', function () {
        var err = GPN.byId('rpError');
        var pw = GPN.byId('rpNew').value;
        if (pw.length < 10) { err.textContent = 'Min 10 characters.'; err.hidden = false; return; }
        var btn = GPN.byId('rpSave');
        GPN.setLoading(btn, true, 'Resetting…');
        GPN.api('adminResetPassword', { id: id, password: pw }).then(function (r) {
          GPN.setLoading(btn, false);
          if (!r.ok) { err.textContent = GPN.friendlyError(r); err.hidden = false; return; }
          GPN.Toast.ok('Password reset. Sessions revoked: ' + ((r.data && r.data.sessionsRevoked) || 0));
          closeModal();
        });
      });
    });
  }

  function deleteStudent(id) {
    if (!confirm('Delete ' + id + '? This soft-deletes (Status = DELETED).')) return;
    GPN.api('adminDeleteStudent', { id: id }).then(function (r) {
      if (!r.ok) { GPN.Toast.error(GPN.friendlyError(r)); return; }
      GPN.Toast.ok('Student deleted.');
      render('students');
    });
  }

  function viewStudent(id) {

  function walletModal(id) {
    GPN.api('adminGetStudent', { id: id }).then(function (j) {
      if (!j.ok) { GPN.Toast.error('Failed to load.'); return; }
      var s = j.data.student || {};
      var w = j.data.wallet || { balance: 0, history: [] };

      var hist = w.history || [];
      var html =
        '<h3 class="gpn-modal-title">Wallet — ' + esc(s.Name || id) + '</h3>' +
        '<p class="gpn-modal-sub">Balance: <b style="color:var(--gold)">' + fmtCur(w.balance || 0) + '</b></p>' +

        '<div class="gpn-card-body">' +
          '<div class="gpn-field"><label class="gpn-label">Amount</label><input id="wAmt" class="gpn-input" type="number" inputmode="numeric"></div>' +
          '<div class="gpn-field"><label class="gpn-label">Method</label>' +
            '<select id="wMethod" class="gpn-select">' + ['UPI','NEFT','Cash','Card','Other'].map(function(m){return '<option>'+m+'</option>';}).join('') + '</select>' +
          '</div>' +
          '<div class="gpn-field"><label class="gpn-label">Reference / Notes</label><input id="wRef" class="gpn-input"></div>' +
          '<div class="gpn-row"><button class="gpn-btn gpn-btn-primary" id="wCredit">+ Credit</button>' +
          '<button class="gpn-btn gpn-btn-danger" id="wRefund">Refund</button>' +
          '<button class="gpn-btn gpn-btn-ghost" id="wSettle">Settle</button></div>' +
        '</div></div>' +
        '<div class="gpn-card"><div class="gpn-card-head"><h3 class="gpn-card-title">History (' + hist.length + ')</h3></div>';
      if (!hist.length) {
        html += '<div class="gpn-card-body"><div class="gpn-empty-state">No transactions.</div></div>';
      } else {
        html += '<div class="gpn-table-wrap" style="border:none;border-radius:0;"><table class="gpn-table"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Balance</th></tr></thead><tbody>';
        hist.slice(0, 20).forEach(function (h) {
          var amt = Number(h.Amount || 0);
          html += '<tr>' +
            '<td data-label="Date">' + esc(GPN.formatDateTime(h.EntryDate)) + '</td>' +
            '<td data-label="Type">' + pill(h.Type || '') + '</td>' +
            '<td data-label="Amount" style="color:' + (amt >= 0 ? 'var(--success)' : 'var(--error)') + ';font-weight:700;">' + (amt >= 0 ? '+' : '') + fmtCur(amt) + '</td>' +
            '<td data-label="Balance">' + fmtCur(h.BalanceAfter || 0) + '</td>' +
          '</tr>';
        });
        html += '</tbody></table></div>';
      }
      html += '</div>' +
        '<div class="gpn-modal-actions"><button class="gpn-btn gpn-btn-ghost" id="wClose">Close</button></div>';

      openModal(html, function () {
        GPN.on(GPN.byId('wClose'), 'click', closeModal);
        GPN.on(GPN.byId('wCredit'), 'click', function () {
          var amt = Number(GPN.byId('wAmt').value);
          if (!amt || amt <= 0) { GPN.Toast.error('Enter amount.'); return; }
          var btn = GPN.byId('wCredit');
          GPN.setLoading(btn, true, 'Adding…');
          GPN.api('adminCreatePayment', {
            StudentID: id, Amount: amt,
            Method: GPN.byId('wMethod').value,
            Reference: GPN.byId('wRef').value
          }).then(function (r) {
            GPN.setLoading(btn, false);
            if (!r.ok) { GPN.Toast.error(GPN.friendlyError(r)); return; }
            GPN.Toast.ok('Credited.');
            walletModal(id);
          });
        });
        GPN.on(GPN.byId('wRefund'), 'click', function () {
          var amt = Number(GPN.byId('wAmt').value);
          if (!amt || amt <= 0) { GPN.Toast.error('Enter amount.'); return; }
          GPN.api('adminWalletRefund', { studentId: id, amount: amt, notes: GPN.byId('wRef').value }).then(function (r) {
            if (!r.ok) { GPN.Toast.error(GPN.friendlyError(r)); return; }
            GPN.Toast.ok('Refunded.'); walletModal(id);
          });
        });
        GPN.on(GPN.byId('wSettle'), 'click', function () {
          if (!confirm('Settle full balance to ₹0?')) return;
          GPN.api('adminWalletSettle', { studentId: id, notes: GPN.byId('wRef').value }).then(function (r) {
            if (!r.ok) { GPN.Toast.error(GPN.friendlyError(r)); return; }
            GPN.Toast.ok('Settled.'); walletModal(id);
          });
        });
      });
    });
  }

  function manageProgramme(pid) {
    Promise.all([loadProgrammes(true), loadSubjects()]).then(function (res) {
      var progs = res[0], subjects = res[1];
      var p = progs.filter(function (x) { return String(x.ProgrammeID) === String(pid); })[0];
      if (!p) { GPN.Toast.error('Not found.'); return; }
      var linked = (p.Subjects || []).map(function (s) { return String(s.SubjectID); });
      var available = subjects.filter(function (s) { return linked.indexOf(String(s.SubjectID)) < 0; });

      var html =
        '<h3 class="gpn-modal-title">' + esc(p.Name) + '</h3>' +
        '<p class="gpn-modal-sub">' + p.NumWeeks + ' weeks · ' + p.TestsPerWeek + ' tests/week · ₹' + (p.TotalPrice || 0) + ' total</p>' +
        '<div class="gpn-card"><div class="gpn-card-head"><h3 class="gpn-card-title">Attached Subjects (' + (p.Subjects || []).length + ')</h3></div>' +
        '<div class="gpn-card-body">' +
          '<div class="gpn-field"><label class="gpn-label">Add Subject</label>' +
            '<select id="mpSubject" class="gpn-select"><option value="">— Select —</option>' + available.map(function (s) { return '<option value="' + esc(s.SubjectID) + '">' + esc(s.Name) + '</option>'; }).join('') + '</select>' +
          '</div>' +
          '<button class="gpn-btn gpn-btn-cyan gpn-btn-sm" id="mpAdd">Add</button>' +
          '<div style="margin-top:12px;">' +
            (p.Subjects || []).map(function (s) {
              return '<div class="gpn-row-between" style="padding:6px 0;border-bottom:1px solid var(--border-hair);"><span>' + esc(s.Name) + '</span><button class="gpn-btn gpn-btn-danger gpn-btn-sm" data-rem="' + esc(s.SubjectID) + '">Remove</button></div>';
            }).join('') || '<div class="gpn-quiet">No subjects attached.</div>' +
          '</div>' +
        '</div></div>' +
        '<div class="gpn-modal-actions"><button class="gpn-btn gpn-btn-ghost" id="mpClose">Close</button></div>';

      openModal(html, function () {
        GPN.on(GPN.byId('mpClose'), 'click', closeModal);
        GPN.on(GPN.byId('mpAdd'), 'click', function () {
          var sid = GPN.byId('mpSubject').value;
          if (!sid) return;
          GPN.api('adminAddProgrammeSubject', { programmeId: pid, subjectId: sid }).then(function (r) {
            if (!r.ok) { GPN.Toast.error(GPN.friendlyError(r)); return; }
            invalidateCaches(); manageProgramme(pid);
          });
        });
        GPN.$$('button[data-rem]').forEach(function (btn) {
          GPN.on(btn, 'click', function () {
            GPN.api('adminRemoveProgrammeSubject', { programmeId: pid, subjectId: btn.dataset.rem }).then(function (r) {
              if (!r.ok) { GPN.Toast.error(GPN.friendlyError(r)); return; }
              invalidateCaches(); manageProgramme(pid);
            });
          });
        });
      });
    });
  }

  function openTest(tid) {
    GPN.api('adminGetTest', { id: tid }).then(function (j) {
      if (!j.ok || !j.data || !j.data.test) { GPN.Toast.error('Not found.'); return; }
      var t = j.data.test;
      var attempts = j.data.attempts || [];
      var results = j.data.results || [];
      var status = String(t.Status || '').toUpperCase();

      var html =
        '<h3 class="gpn-modal-title">' + esc(t.Title) + '</h3>' +
        '<p class="gpn-modal-sub">' + esc(t.TestID) + ' · ' + status + ' · ' + t.TotalMarks + ' marks · ' + t.Duration + ' min · ' + fmtCur(t.Price || 0) + '</p>';

      html += '<div class="gpn-card"><div class="gpn-card-head"><h3 class="gpn-card-title">Google Form</h3></div><div class="gpn-card-body">';
      if (t.FormID) {
        html += '<div class="gpn-quiet" style="margin-bottom:8px;">Linked. Form ID: <span class="gpn-mono">' + esc(t.FormID) + '</span></div>';
        html += '<div class="gpn-row"><button class="gpn-btn gpn-btn-ghost gpn-btn-sm" id="tfCopyForm">Copy Form ID</button>' +
                (t.FormURL ? '<a class="gpn-btn gpn-btn-ghost gpn-btn-sm" href="' + esc(t.FormURL) + '" target="_blank" rel="noopener">Open Form</a>' : '') + '</div>';
      } else {
        html += '<div class="gpn-field"><label class="gpn-label">Form URL</label><input id="tfUrl" class="gpn-input" placeholder="https://docs.google.com/forms/d/e/.../viewform"></div>';
        html += '<div class="gpn-field"><label class="gpn-label">Form ID or Edit URL</label><input id="tfId" class="gpn-input"></div>';
        html += '<button class="gpn-btn gpn-btn-cyan gpn-btn-sm" id="tfLink">Link Form</button>';
      }
      html += '</div></div>';

      var ALLOWED = { DRAFT: ['AVAILABLE'], AVAILABLE: ['CLOSED'], CLOSED: ['EVALUATED'], EVALUATED: ['PUBLISHED'], PUBLISHED: [] };
      var nexts = ALLOWED[status] || [];
      html += '<div class="gpn-card"><div class="gpn-card-head"><h3 class="gpn-card-title">Lifecycle</h3></div><div class="gpn-card-body">';
      if (nexts.length) {
        html += '<div class="gpn-row">' + nexts.map(function (n) { return '<button class="gpn-btn gpn-btn-cyan gpn-btn-sm" data-status="' + n + '">Move → ' + n + '</button>'; }).join('') + '</div>';
      } else {
        html += '<div class="gpn-quiet">No manual transitions available.</div>';
      }
      html += '</div></div>';

      html += '<div class="gpn-card"><div class="gpn-card-head"><h3 class="gpn-card-title">Sync &amp; Publish</h3></div><div class="gpn-card-body">' +
        '<div class="gpn-row">' +
        '<button class="gpn-btn gpn-btn-cyan gpn-btn-sm" id="tfSync">Sync Submissions</button>' +
        '<button class="gpn-btn gpn-btn-primary gpn-btn-sm" id="tfPublish">Publish Evaluated</button>' +
        '</div></div></div>';

      html += '<div class="gpn-card"><div class="gpn-card-head"><h3 class="gpn-card-title">Attempts (' + attempts.length + ')</h3></div>';
      if (!attempts.length) {
        html += '<div class="gpn-card-body"><div class="gpn-empty-state">No attempts yet.</div></div>';
      } else {
        html += '<div class="gpn-table-wrap" style="border:none;border-radius:0;"><table class="gpn-table"><thead><tr><th>Attempt</th><th>Student</th><th>Status</th><th>Cost</th><th></th></tr></thead><tbody>';
        attempts.forEach(function (a) {
          html += '<tr>' +
            '<td data-label="Attempt" class="gpn-mono">' + esc(a.AttemptID) + '</td>' +
            '<td data-label="Student">' + esc(a.StudentID) + '</td>' +
            '<td data-label="Status">' + pill(a.Status || '') + '</td>' +
            '<td data-label="Cost">' + fmtCur(a.CostCharged || 0) + '</td>' +
            '<td data-label="Actions">' + (String(a.Status).toUpperCase() === 'SUBMITTED' ? '<button class="gpn-btn gpn-btn-primary gpn-btn-sm" data-eval="' + esc(a.AttemptID) + '">Evaluate</button>' : '') + '</td>' +
          '</tr>';
        });
        html += '</tbody></table></div>';
      }
      html += '</div>';

      html += '<div class="gpn-card"><div class="gpn-card-head"><h3 class="gpn-card-title">Results (' + results.length + ')</h3></div>';
      if (!results.length) {
        html += '<div class="gpn-card-body"><div class="gpn-empty-state">No results yet.</div></div>';
      } else {
        html += '<div class="gpn-table-wrap" style="border:none;border-radius:0;"><table class="gpn-table"><thead><tr><th>Student</th><th>Score</th><th>%</th><th>Pub</th><th></th></tr></thead><tbody>';
        results.forEach(function (r) {
          html += '<tr>' +
            '<td data-label="Student">' + esc(r.StudentID) + '</td>' +
            '<td data-label="Score">' + esc(r.MarksObtained) + ' / ' + esc(r.MaxMarks) + '</td>' +

  function renderEvaluation(attemptId) {
    GPN.showContainerLoading(viewRoot, 'Loading evaluation…');
    GPN.api('adminGetAttemptForEvaluation', { attemptId: attemptId }).then(function (j) {
      if (!j.ok) { GPN.showContainerError(viewRoot, GPN.friendlyError(j)); return; }
      var d = j.data || {};
      var a = d.attempt || {};
      var autoRows = d.autoRows || [], manualRows = d.manualRows || [];

      var html = '<div class="gpn-card"><div class="gpn-card-head">' +
        '<h3 class="gpn-card-title">Evaluate — ' + esc(a.StudentName || a.StudentID) + '</h3>' +
        '<button class="gpn-btn gpn-btn-ghost gpn-btn-sm" id="evBack">← Back</button>' +
        '</div><div class="gpn-card-body"><div class="gpn-quiet">' + esc(a.TestTitle) + ' · Auto: ' + d.autoScore + ' · Manual max: ' + d.manualMax + ' · Grand max: ' + d.grandMax + '</div></div></div>';

      if (autoRows.length) {
        html += '<div class="gpn-card"><div class="gpn-card-head"><h3 class="gpn-card-title">Auto-scored (' + autoRows.length + ')</h3></div><div class="gpn-card-body">';
        autoRows.forEach(function (r) {
          html += '<div style="padding:8px 0;border-bottom:1px solid var(--border-hair);"><div class="gpn-quiet">' + esc(r.QuestionTitle) + '</div><div>' + esc(r.StudentAnswer || '—') + '</div><div style="color:var(--gold);font-weight:700;">Score: ' + r.AutoMarks + '</div></div>';
        });
        html += '</div></div>';
      }

      if (manualRows.length) {
        html += '<div class="gpn-card"><div class="gpn-card-head"><h3 class="gpn-card-title">Manual (' + manualRows.length + ')</h3></div><div class="gpn-card-body">';
        manualRows.forEach(function (r, i) {
          var cur = (r.ManualMarks === '' || r.ManualMarks === null) ? '' : r.ManualMarks;
          html += '<div style="border:1px solid var(--border-soft);border-radius:6px;padding:12px;margin-bottom:10px;">' +
            '<div class="gpn-quiet" style="margin-bottom:6px;">' + esc(r.QuestionTitle) + ' (max ' + r.MaxPoints + ')</div>' +
            '<div style="background:rgba(0,0,0,.25);padding:8px;border-radius:4px;font-size:0.85rem;white-space:pre-wrap;margin-bottom:8px;">' + esc(r.StudentAnswer || '(blank)') + '</div>' +
            '<div class="gpn-grid-2">' +
              '<div class="gpn-field"><label class="gpn-label">Marks</label><input id="evM_' + i + '" class="gpn-input" type="number" min="0" max="' + r.MaxPoints + '" value="' + esc(cur) + '"></div>' +
              '<div class="gpn-field"><label class="gpn-label">Remark</label><input id="evR_' + i + '" class="gpn-input" value="' + esc(r.EvaluatorRemark || '') + '"></div>' +
            '</div>' +
          '</div>';
        });
        html += '<button class="gpn-btn gpn-btn-primary" id="evSave">Save Evaluation</button></div></div>';
      }

      viewRoot.innerHTML = html;
      GPN.on(GPN.byId('evBack'), 'click', function () { render('evaluations'); });

      var save = GPN.byId('evSave');
      if (save) GPN.on(save, 'click', function () {
        var evals = [];
        manualRows.forEach(function (r, i) {
          var mk = GPN.byId('evM_' + i).value.trim();
          if (mk === '') return;
          evals.push({ answerId: r.AnswerID, marks: Number(mk), remark: GPN.byId('evR_' + i).value.trim() });
        });
        if (!evals.length) { GPN.Toast.error('Enter at least one mark.'); return; }
        GPN.setLoading(save, true, 'Saving…');
        GPN.api('adminSubmitEvaluation', { attemptId: attemptId, evaluations: evals }).then(function (r) {
          GPN.setLoading(save, false);
          if (!r.ok) { GPN.Toast.error(GPN.friendlyError(r)); return; }
          var dd = r.data || {};
          if (dd.status === 'PARTIAL') {
            GPN.Toast.ok('Partial. ' + dd.pendingRemaining + ' pending.');
            renderEvaluation(attemptId);
          } else {
            GPN.Toast.ok('Complete. ' + dd.totalObtained + ' / ' + dd.grandMax);
            render('evaluations');
          }
        });
      });
    });
  }
