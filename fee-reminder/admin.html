<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPN - Admin Dashboard</title>
  <style>
    :root {
      --bg-dark: #0A192F;
      --card-bg: #112240;
      --text-main: #CCD6F6;
      --text-muted: #8892B0;
      --cyan: #00FFFF;
      --gold: #FFD54F;
      --error: #FF6B6B;
    }
    
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    .admin-wrapper {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid #233554;
      padding-bottom: 15px;
    }
    
    .header h2 {
      margin: 0;
      color: var(--cyan);
    }
    
    .logout-btn {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    
    .logout-btn:hover {
      background: rgba(255, 213, 79, 0.1);
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .search-box {
      flex-grow: 1;
      padding: 12px 15px;
      background-color: var(--card-bg);
      border: 1px solid #233554;
      border-radius: 8px;
      color: var(--text-main);
      font-size: 15px;
    }
    .search-box:focus { outline: none; border-color: var(--cyan); }

    .filter-box {
      padding: 12px;
      background-color: var(--card-bg);
      border: 1px solid #233554;
      border-radius: 8px;
      color: var(--text-main);
      cursor: pointer;
      font-size: 15px;
    }

    .student-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 5px solid var(--text-muted);
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    
    .student-card.late { border-left-color: var(--error); }
    .student-card.due { border-left-color: var(--gold); }

    .student-info { flex-grow: 1; }
    
    .student-info h4 { 
      margin: 0 0 8px 0; 
      font-size: 18px; 
      color: var(--text-main); 
      display: flex;
      align-items: center;
    }
    
    .meta-row {
      display: flex;
      gap: 15px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    
    .meta-row span {
      background: rgba(2, 12, 27, 0.5);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .date-row {
      font-size: 13px;
      color: var(--text-muted);
    }
    
    .date-row strong { color: var(--text-main); }

    .amount-section {
      text-align: right;
      min-width: 140px;
    }

    .amount { 
      font-size: 22px; 
      font-weight: bold; 
      color: var(--cyan); 
      margin-bottom: 10px;
    }
    
    .badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      margin-left: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge.late { background-color: rgba(255, 107, 107, 0.1); color: var(--error); border: 1px solid var(--error); }
    .badge.due { background-color: rgba(255, 213, 79, 0.1); color: var(--gold); border: 1px solid var(--gold); }

    .pay-btn {
      background-color: var(--cyan);
      color: var(--bg-dark);
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      width: 100%;
    }
    .pay-btn:hover { background-color: #00cccc; box-shadow: 0 0 10px rgba(0, 255, 255, 0.4); }
    .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #loading-indicator { text-align: center; color: var(--gold); padding: 40px; font-weight: bold; }
  </style>
</head>
<body>

<div class="admin-wrapper">
  <div class="header">
    <div>
      <h2>GPN Fee Management</h2>
      <div id="welcome-msg" style="color: var(--text-muted); font-size: 14px; margin-top:5px;"></div>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" class="search-box" placeholder="Search by name, phone, or parent..." onkeyup="renderList()">
    <select id="statusFilter" class="filter-box" onchange="renderList()">
      <option value="ALL">All Unpaid</option>
      <option value="Due">Due Only</option>
      <option value="Late">Late Only</option>
    </select>
  </div>

  <div id="loading-indicator">Syncing secure database...</div>
  <div id="student-list"></div>
</div>

<script>
  let globalData = [];
  const API_URL = "https://script.google.com/macros/s/AKfycbx9YoiIwRok4D-YaNNkg1LHyuc5ZngbwKAv7TLNsbKZr1Jk_ntf5lhpBiG3bW-ibkJ_fQ/exec";
  const token = sessionStorage.getItem('gpn_token');
  const teacherName = sessionStorage.getItem('gpn_name');

  if (!token) {
    window.location.href = "index.html"; 
  } else {
    document.getElementById('welcome-msg').innerText = `Logged in as: ${teacherName}`;
    fetchData();
  }

  async function fetchData() {
    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'fetchData', token: token })
      });
      
      const res = await response.json();
      if (res.success) {
        globalData = res.data;
        document.getElementById('loading-indicator').style.display = 'none';
        renderList();
      } else {
        alert("Session expired. Please log in again.");
        logout();
      }
    } catch (err) {
      document.getElementById('loading-indicator').innerText = 'Network error loading data.';
      document.getElementById('loading-indicator').style.color = 'var(--error)';
    }
  }

  function renderList() {
    const listContainer = document.getElementById('student-list');
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const statusFilter = document.getElementById('statusFilter').value;
    
    listContainer.innerHTML = '';
    
    let filteredData = globalData.filter(item => {
      // Search matches Name, Parent, or Phone number
      const matchSearch = item.studentName.toLowerCase().includes(searchTerm) || 
                          item.parentName.toLowerCase().includes(searchTerm) ||
                          item.phone.includes(searchTerm);
      const matchStatus = (statusFilter === 'ALL') || (item.status === statusFilter);
      return matchSearch && matchStatus;
    });

    if (filteredData.length === 0) {
      listContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:30px;">No records match your search.</div>';
      return;
    }

    filteredData.forEach(item => {
      const badgeClass = item.status.toLowerCase();
      const badgeText = item.status === 'Late' ? `Late: ${item.daysLate} Days` : 'Due';
      
      const card = document.createElement('div');
      card.className = `student-card ${badgeClass}`;
      
      // Using the rich data injected from the Apps Script
      card.innerHTML = `
        <div class="student-info">
          <h4>${item.studentName} <span class="badge ${badgeClass}">${badgeText}</span></h4>
          <div class="meta-row">
            <span>👤 ${item.parentName}</span>
            <span>📞 ${item.phone}</span>
          </div>
          <div class="meta-row">
            <span>🏫 ${item.school}</span>
            <span>📚 ${item.studentClass}</span>
          </div>
          <div class="date-row">
            Cycle Start: <strong>${item.cycleStart}</strong> &nbsp;|&nbsp; Due Date: <strong>${item.dueDate}</strong>
          </div>
        </div>
        <div class="amount-section">
          <div class="amount">₹${item.amount}</div>
          <button class="pay-btn" id="btn-${item.cycleId}" onclick="processPayment('${item.cycleId}', ${item.amount})">
            Mark Paid
          </button>
        </div>
      `;
      listContainer.appendChild(card);
    });
  }

  async function processPayment(cycleId, amount) {
    const btn = document.getElementById(`btn-${cycleId}`);
    if(!confirm(`Collect payment of ₹${amount}?`)) return;
    
    btn.innerText = 'Syncing...';
    btn.disabled = true;

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'markPaid', token: token, cycleId: cycleId, amount: amount })
      });
      
      const res = await response.json();
      if (res.success) {
        // Optimistic UI Update - instantly remove from view
        globalData = globalData.filter(item => item.cycleId !== cycleId);
        renderList();
      } else {
        alert(res.message);
        btn.innerText = 'Mark Paid';
        btn.disabled = false;
      }
    } catch (err) {
      alert("Payment failed to sync due to network error.");
      btn.innerText = 'Mark Paid';
      btn.disabled = false;
    }
  }

  function logout() {
    sessionStorage.clear();
    window.location.href = "index.html"; 
  }
</script>
</body>
</html>
