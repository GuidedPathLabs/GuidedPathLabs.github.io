<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPN Fee Management</title>
<style>
  :root {
    --bg: #0A192F;
    --link: #FFD54F;
    --cyan: #17B4C9;
    --cyan-dark: #0E8A9C;
    --card-bg: #112a4a;
    --input-bg: #0d2240;
    --border: #1e3a5f;
    --text: #E6EEF7;
    --text-dim: #9fb3c8;
    --error: #ff6b6b;
    --paid: #3ddc84;
    --due: #ffc94d;
    --late: #ff5c5c;
    --fee-color: #4de3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg);
    font-family: -apple-system, Roboto, Segoe UI, Arial, sans-serif;
    color: var(--text); padding-bottom: 70px;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; background: var(--card-bg); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; color: var(--link); margin: 0; }
  header .who { font-size: 12px; color: var(--text-dim); }
  header button { background: none; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 13px; }

  nav {
    display: flex; overflow-x: auto; background: var(--card-bg);
    border-bottom: 1px solid var(--border); position: sticky; top: 49px; z-index: 9;
  }
  nav button {
    flex: 1; min-width: 90px; background: none; border: none; color: var(--text-dim);
    padding: 12px 8px; font-size: 13px; border-bottom: 2px solid transparent;
  }
  nav button.active { color: var(--link); border-bottom-color: var(--cyan); font-weight: 600; }

  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  .page { display: none; }
  .page.active { display: block; }

  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .kpi-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .kpi-card .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi-card .value { font-size: 21px; font-weight: 700; margin-top: 4px; }
  .kpi-card.collected .value { color: var(--paid); }
  .kpi-card.outstanding .value { color: var(--late); }
  .kpi-card.expected .value { color: var(--fee-color); }

  .section-title { font-size: 15px; color: var(--link); margin: 20px 0 10px 0; font-weight: 600; }

  input, select, textarea {
    width: 100%; padding: 10px 12px; background: var(--input-bg);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; margin-bottom: 10px;
  }
  label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }

  .filter-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
  .filter-chip {
    white-space: nowrap; padding: 7px 14px; border-radius: 16px; border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text-dim); font-size: 12px; font-weight: 600;
  }
  .filter-chip.active { background: var(--cyan); color: #06202a; border-color: var(--cyan); }

  .student-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
  }
  .student-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .student-card .name { font-weight: 700; font-size: 16px; color: var(--text); }
  .student-card .sid { font-size: 11px; color: var(--text-dim); font-weight: 400; }
  .student-card .meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .student-card .date-row { font-size: 12px; color: var(--text-dim); margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
  .student-card .cycle-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .student-card .fee { font-size: 18px; font-weight: 700; color: var(--fee-color); }

  .badge { font-size: 11px; padding: 4px 10px; border-radius: 12px; font-weight: 700; white-space: nowrap; }
  .badge.PAID { background: rgba(61,220,132,0.18); color: var(--paid); }
  .badge.DUE { background: rgba(255,201,77,0.18); color: var(--due); }
  .badge.LATE { background: rgba(255,92,92,0.2); color: var(--late); }
  .badge.UPCOMING, .badge.NONE { background: rgba(159,179,200,0.15); color: var(--text-dim); }

  button.btn {
    background: var(--cyan); color: #06202a; border: none; padding: 10px 18px;
    border-radius: 8px; font-size: 13px; font-weight: 700;
  }
  button.btn.outline { background: none; border: 1.5px solid var(--cyan); color: var(--cyan); }
  button.btn.danger { background: var(--late); color: #2a0606; }
  button.btn.full { width: 100%; padding: 13px; font-size: 15px; }
  button.btn.sm { padding: 7px 14px; font-size: 12.5px; }
  button.btn.paid-btn { background: var(--paid); color: #06260f; }
  button.btn.reverse-btn { background: none; border: 1.5px solid var(--paid); color: var(--paid); }

  .error-line { color: var(--error); font-size: 13px; margin-top: 6px; }
  .success-line { color: var(--paid); font-size: 13px; margin-top: 6px; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    z-index: 100; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card-bg); width: 100%; max-width: 480px; max-height: 88vh;
    overflow-y: auto; border-radius: 16px 16px 0 0; padding: 20px;
  }
  .modal h2 { font-size: 18px; color: var(--link); margin-top: 0; }
  .modal-close { float: right; background: none; border: none; color: var(--text-dim); font-size: 22px; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  details { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  details summary { color: var(--text-dim); font-size: 13px; cursor: pointer; }
  .log-row { font-size: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .log-row .top { display: flex; justify-content: space-between; }
  .empty-state { color: var(--text-dim); font-size: 13px; text-align: center; padding: 30px 0; }
</style>
</head>
<body>

<header>
  <div>
    <h1>GPN Fee Management</h1>
    <div class="who" id="whoLabel"></div>
  </div>
  <button id="logoutBtn">Logout</button>
</header>

<nav>
  <button class="navbtn active" data-page="overview">Overview</button>
  <button class="navbtn" data-page="students">Students</button>
  <button class="navbtn" data-page="collections">Collections</button>
  <button class="navbtn" data-page="messages">Message Logs</button>
  <button class="navbtn" data-page="sync">Sync</button>
</nav>

<main>

  <section class="page active" id="page-overview">
    <div class="kpi-grid" id="kpiGrid"></div>
    <div class="section-title">Teacher-wise</div>
    <div id="teacherSummary"></div>
    <button class="btn outline full" id="changePwBtn" style="margin-top:20px;">Change Password</button>
  </section>

  <section class="page" id="page-students">
    <input type="text" id="studentSearch" placeholder="Search name, parent, phone, school...">
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="LATE">Late</button>
      <button class="filter-chip" data-filter="DUE">Due</button>
      <button class="filter-chip" data-filter="PAID">Paid</button>
      <button class="filter-chip" data-filter="inactive">Inactive</button>
      <button class="filter-chip" data-filter="T001">Super Admin</button>
      <button class="filter-chip" data-filter="T002">Academic Head</button>
    </div>
    <button class="btn full" id="addStudentBtn" style="margin-bottom:14px;">+ Add Student</button>
    <div id="studentList"></div>
  </section>

  <section class="page" id="page-collections">
    <div class="kpi-grid" id="collectionKpis"></div>
    <div class="section-title">By Teacher</div>
    <div id="collectionByTeacher"></div>
  </section>

  <section class="page" id="page-messages">
    <input type="text" id="msgStudentFilter" placeholder="Filter by Student_ID (optional)">
    <button class="btn" id="loadMsgBtn" style="margin-bottom:12px;">Load</button>
    <div id="msgList"></div>
  </section>

  <section class="page" id="page-sync">
    <p style="color:var(--text-dim); font-size:13px;">Paste new student rows directly into the Students sheet first, then press Sync. Existing cycles and payment data are never touched — only missing future cycles get created.</p>
    <button class="btn full" id="syncBtn">Press Sync</button>
    <div id="syncResult"></div>
    <div class="section-title">Recent Sync Jobs</div>
    <div id="syncJobList"></div>
  </section>

</main>

<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <button class="modal-close" id="closeDetail">&times;</button>
    <div id="detailContent"></div>
  </div>
</div>

<div class="modal-overlay" id="studentFormModal">
  <div class="modal">
    <button class="modal-close" id="closeStudentForm">&times;</button>
    <h2 id="studentFormTitle">Add Student</h2>
    <form id="studentForm">
      <input type="hidden" id="f_Student_ID">
      <label>Student Name</label>
      <input type="text" id="f_Student_Name" required>
      <label>Parent Name</label>
      <input type="text" id="f_Parent_Name" required>
      <label>Parent WhatsApp</label>
      <input type="text" id="f_Parent_WhatsApp" required placeholder="e.g. 919876543210">
      <label>School Name</label>
      <input type="text" id="f_School_Name" required>
      <label>Class</label>
      <input type="text" id="f_Class" required>
      <label>Date of Joining</label>
      <input type="date" id="f_DOJ" required>
      <label>Monthly Fee (₹)</label>
      <input type="number" id="f_Monthly_Fee" required min="1">
      <label>Teacher</label>
      <select id="f_Teacher_ID" required>
        <option value="T001">Super Admin</option>
        <option value="T002">Academic Head</option>
      </select>
      <button type="submit" class="btn full">Save</button>
      <div class="error-line" id="studentFormError"></div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="pwModal">
  <div class="modal">
    <button class="modal-close" id="closePwModal">&times;</button>
    <h2>Change Password</h2>
    <form id="pwForm">
      <label>Current Password</label>
      <input type="password" id="pw_current" required>
      <label>New Password (min 8 characters)</label>
      <input type="password" id="pw_new" required minlength="8">
      <button type="submit" class="btn full">Update Password</button>
      <div class="error-line" id="pwError"></div>
      <div class="success-line" id="pwSuccess"></div>
    </form>
  </div>
</div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx9YoiIwRok4D-YaNNkg1LHyuc5ZngbwKAv7TLNsbKZr1Jk_ntf5lhpBiG3bW-ibkJ_fQ/exec';
  const ADMIN_DISPLAY = { T001: 'Super Admin', T002: 'Academic Head' };
  const BADGE_LABEL = { PAID: 'Paid', DUE: 'Due', LATE: 'Late', UPCOMING: 'Upcoming', NONE: 'No cycle' };

  const token = sessionStorage.getItem('gpn_token');
  if (!token) window.location.href = 'index.html';
  document.getElementById('whoLabel').textContent = sessionStorage.getItem('gpn_displayName') || '';

  function safeString(val) {
    if (typeof val === 'string') return val;
    if (val === null || val === undefined) return 'Unknown error';
    try { return JSON.stringify(val); } catch (e) { return 'Unknown error'; }
  }

  async function api(action, payload) {
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, token: token, payload: payload || {} })
    });
    let data;
    try { data = await res.json(); }
    catch (e) { return { success: false, error: 'BAD_RESPONSE (HTTP ' + res.status + ')', data: null }; }

    if (!data || typeof data.success === 'undefined') {
      return { success: false, error: 'UNEXPECTED_RESPONSE', data: null };
    }
    if (!data.success && data.error === 'SESSION_EXPIRED') {
      sessionStorage.clear();
      window.location.href = 'index.html';
      throw new Error('SESSION_EXPIRED');
    }
    return data;
  }

  function badgeHtml(status, daysLate) {
    const label = status === 'LATE' ? 'Late · ' + daysLate + ' day' + (daysLate === 1 ? '' : 's') : BADGE_LABEL[status];
    return '<span class="badge ' + status + '">' + label + '</span>';
  }

  // NAVIGATION
  const navButtons = document.querySelectorAll('.navbtn');
  navButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      navButtons.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
      document.getElementById('page-' + btn.dataset.page).classList.add('active');
      if (btn.dataset.page === 'overview') loadOverview();
      if (btn.dataset.page === 'students') loadStudents();
      if (btn.dataset.page === 'collections') loadCollections();
      if (btn.dataset.page === 'sync') loadSyncJobs();
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', async function () {
    await api('logout', {});
    sessionStorage.clear();
    window.location.href = 'index.html';
  });

  // OVERVIEW
  async function loadOverview() {
    const res = await api('getDashboard', {});
    if (!res.success) return;
    const d = res.data;
    document.getElementById('kpiGrid').innerHTML =
      kpiCard('Active Students', d.activeStudents, '') +
      kpiCard('Total Collection', '₹' + d.totalCollection.toLocaleString('en-IN'), 'collected') +
      kpiCard('This Month', '₹' + d.currentMonthCollection.toLocaleString('en-IN'), 'collected') +
      kpiCard('Outstanding', '₹' + d.totalOutstanding.toLocaleString('en-IN'), 'outstanding');
    document.getElementById('teacherSummary').innerHTML = Object.keys(d.byTeacher).map(function (tid) {
      const t = d.byTeacher[tid];
      return '<div class="student-card" style="cursor:default;"><div class="name">' + ADMIN_DISPLAY[tid] + '</div>' +
        '<div class="meta">Collection: <span style="color:var(--paid);font-weight:600;">₹' + t.collection.toLocaleString('en-IN') + '</span> &nbsp;·&nbsp; Outstanding: <span style="color:var(--late);font-weight:600;">₹' + t.outstanding.toLocaleString('en-IN') + '</span></div></div>';
    }).join('');
  }
  function kpiCard(label, value, cls) {
    return '<div class="kpi-card ' + (cls || '') + '"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
  }

  // STUDENTS LIST — FIX: single getStudents call, no per-student loop
  let currentFilter = 'all';
  let allStudentsCache = [];

  document.getElementById('studentSearch').addEventListener('input', function () { renderStudentList(); });
  document.querySelectorAll('.filter-chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      document.querySelectorAll('.filter-chip').forEach(function (c) { c.classList.remove('active'); });
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      renderStudentList();
    });
  });

  async function loadStudents() {
    const res = await api('getStudents', {});
    if (!res.success) { alert(safeString(res.error)); return; }
    allStudentsCache = res.data;
    renderStudentList();
  }

  function renderStudentList() {
    const q = document.getElementById('studentSearch').value.toLowerCase();
    let list = allStudentsCache.filter(function (s) {
      return !q || s.Student_Name.toLowerCase().includes(q) || s.Parent_Name.toLowerCase().includes(q) ||
        String(s.Parent_WhatsApp).includes(q) || s.School_Name.toLowerCase().includes(q);
    });
    if (currentFilter === 'inactive') list = list.filter(function (s) { return s.Student_Status === 'INACTIVE'; });
    else if (currentFilter === 'T001' || currentFilter === 'T002') list = list.filter(function (s) { return s.Teacher_ID === currentFilter; });
    else if (['LATE', 'DUE', 'PAID'].indexOf(currentFilter) !== -1) list = list.filter(function (s) { return s.Status === currentFilter; });

    const container = document.getElementById('studentList');
    if (list.length === 0) { container.innerHTML = '<div class="empty-state">No students match.</div>'; return; }

    container.innerHTML = list.map(function (s) {
      const c = s.CurrentCycle;
      let cycleHtml;
      if (c) {
        const showMarkPaid = s.Status !== 'PAID';
        cycleHtml =
          '<div class="date-row">📅 ' + c.Cycle_Start + ' &nbsp; ⏰ Due: ' + c.Due_Date + '</div>' +
          '<div class="cycle-row"><span class="fee">₹' + c.Cycle_Fee + '</span>' +
          '<button class="btn sm ' + (showMarkPaid ? 'paid-btn' : 'reverse-btn') + '" onclick="event.stopPropagation(); quickToggle(\'' + s.Student_ID + '\',\'' + c.Cycle_ID + '\')">' +
          (showMarkPaid ? 'Mark Paid' : 'Paid ✓') + '</button></div>';
      } else {
        cycleHtml = '<div class="meta" style="margin-top:8px;">No active cycle</div>';
      }

      return '<div class="student-card" onclick="openStudentDetail(\'' + s.Student_ID + '\')">' +
        '<div class="top-row"><div><div class="name">' + s.Student_Name + ' <span class="sid">(' + s.Student_ID + ')</span></div>' +
        '<div class="meta">' + s.Parent_Name + ' · ' + s.School_Name + ' · Class ' + s.Class + ' · ' + ADMIN_DISPLAY[s.Teacher_ID] +
        (s.Student_Status === 'INACTIVE' ? ' · <span style="color:var(--late)">INACTIVE</span>' : '') + '</div></div>' +
        badgeHtml(s.Status, s.DaysLate) + '</div>' +
        cycleHtml + '</div>';
    }).join('');
  }

  async function quickToggle(studentId, cycleId) {
    const res = await api('togglePayment', { studentId: studentId, cycleId: cycleId });
    if (res.success) loadStudents();
    else alert(safeString(res.error));
  }

  // STUDENT DETAIL
  async function openStudentDetail(studentId) {
    const [studentRes, cyclesRes, msgRes] = await Promise.all([
      api('getStudent', { studentId: studentId }),
      api('getFeeCycles', { studentId: studentId }),
      api('getStudentMessageHistory', { studentId: studentId })
    ]);
    if (!studentRes.success) { alert(safeString(studentRes.error)); return; }
    const s = studentRes.data;
    const cycles = cyclesRes.success ? cyclesRes.data : [];
    const msgs = msgRes.success ? msgRes.data : [];

    const current = cycles.find(function (c) { return c.Status === 'DUE' || c.Status === 'LATE' || (c.Status === 'PAID' && isTodayInRange_(c)); });
    const past = cycles.filter(function (c) { return c !== current && (c.Status === 'PAID' || c.Status === 'LATE'); });
    const future = cycles.filter(function (c) { return c.Status === 'UPCOMING'; });
    const unpaidPast = past.filter(function (c) { return c.Status === 'LATE'; });

    let html = '<h2>' + s.Student_Name + '</h2>';
    html += '<div class="meta">' + s.Student_ID + ' · ' + s.Parent_Name + ' (' + s.Parent_WhatsApp + ')</div>';
    html += '<div class="meta">' + s.School_Name + ' · Class ' + s.Class + ' · DOJ ' + s.DOJ + ' · ' + ADMIN_DISPLAY[s.Teacher_ID] + '</div>';
    html += '<hr class="divider">';

    function cycleBlock(c, title) {
      const showMarkPaid = c.Status !== 'PAID';
      return '<div class="student-card" style="cursor:default;"><div class="top-row"><div class="name" style="font-size:14px;">' + title + ': ' + c.Cycle_Label + '</div>' + badgeHtml(c.Status, c.DaysLate) + '</div>' +
        '<div class="date-row">📅 ' + c.Cycle_Start + ' – ' + c.Cycle_End + ' &nbsp; ⏰ Due ' + c.Due_Date + '</div>' +
        '<div class="cycle-row"><span class="fee">₹' + c.Cycle_Fee + '</span>' +
        '<button class="btn sm ' + (showMarkPaid ? 'paid-btn' : 'reverse-btn') + '" onclick="togglePaymentAndRefresh(\'' + s.Student_ID + '\',\'' + c.Cycle_ID + '\')">' +
        (showMarkPaid ? 'Mark Paid' : 'Paid ✓ (tap to reverse)') + '</button></div></div>';
    }

    unpaidPast.forEach(function (c) { html += cycleBlock(c, 'Previous'); });
    if (current) html += cycleBlock(current, 'Current'); else html += '<div class="empty-state">No current cycle</div>';

    if (future.length > 0) {
      html += '<details><summary>Future schedule (' + future.length + ' cycles)</summary>';
      future.slice(0, 6).forEach(function (c) {
        html += '<div class="meta" style="padding:6px 0;">' + c.Cycle_Label + ': ' + c.Cycle_Start + ' – ' + c.Cycle_End + ' · ₹' + c.Cycle_Fee + '</div>';
      });
      html += '</details>';
    }

    html += '<details><summary>Payment history (' + past.length + ' past cycles)</summary>';
    if (past.length === 0) html += '<div class="meta">No past cycles yet.</div>';
    past.forEach(function (c) {
      html += '<div class="log-row"><div class="top"><span>' + c.Cycle_Label + '</span>' + badgeHtml(c.Status, c.DaysLate) + '</div>' +
        (c.PaidAt ? '<div class="meta">Paid ' + c.PaidAt + '</div>' : '') + '</div>';
    });
    html += '</details>';

    html += '<details><summary>WhatsApp message history (' + msgs.length + ')</summary>';
    if (msgs.length === 0) html += '<div class="meta">No messages logged yet.</div>';
    msgs.forEach(function (m) {
      html += '<div class="log-row"><div class="top"><span>' + m.Template_Name + '</span><span>' + m.Delivery_Status + '</span></div></div>';
    });
    html += '</details>';

    html += '<hr class="divider">';
    html += '<button class="btn outline full" onclick="openEditStudent(\'' + s.Student_ID + '\')" style="margin-bottom:8px;">Edit Student</button>';
    html += '<button class="btn outline full" onclick="toggleStudentStatus(\'' + s.Student_ID + '\',\'' + s.Student_Status + '\')" style="margin-bottom:8px;">' +
      (s.Student_Status === 'ACTIVE' ? 'Inactivate Student' : 'Reactivate Student') + '</button>';
    html += '<button class="btn danger full" onclick="confirmHardDelete(\'' + s.Student_ID + '\',\'' + s.Student_Name + '\')">Hard Delete</button>';

    document.getElementById('detailContent').innerHTML = html;
    document.getElementById('detailModal').classList.add('active');
  }
  function isTodayInRange_(c) {
    // Cycle_Start/End here are already "dd MMM yyyy" display strings from the
    // backend's Status field logic — Status itself (DUE/LATE/PAID while current)
    // is sufficient to identify "the current cycle" without re-parsing dates here.
    return true;
  }
  document.getElementById('closeDetail').addEventListener('click', function () {
    document.getElementById('detailModal').classList.remove('active');
  });

  async function togglePaymentAndRefresh(studentId, cycleId) {
    const res = await api('togglePayment', { studentId: studentId, cycleId: cycleId });
    if (res.success) openStudentDetail(studentId);
    else alert(safeString(res.error));
  }

  async function toggleStudentStatus(studentId, currentStatus) {
    const action = currentStatus === 'ACTIVE' ? 'inactivateStudent' : 'reactivateStudent';
    const res = await api(action, { studentId: studentId });
    if (res.success) { document.getElementById('detailModal').classList.remove('active'); loadStudents(); }
    else alert(safeString(res.error));
  }

  function confirmHardDelete(studentId, studentName) {
    const typed = prompt('Type DELETE to permanently remove ' + studentName + ' and all linked records:');
    if (typed === null) return;
    hardDelete(studentId, typed);
  }
  async function hardDelete(studentId, typed) {
    const res = await api('hardDeleteStudent', { studentId: studentId, confirmText: typed });
    if (res.success) { document.getElementById('detailModal').classList.remove('active'); loadStudents(); }
    else alert(res.error === 'CONFIRMATION_TEXT_MISMATCH' ? 'You must type DELETE exactly.' : safeString(res.error));
  }

  // ADD / EDIT STUDENT
  document.getElementById('addStudentBtn').addEventListener('click', function () {
    document.getElementById('studentForm').reset();
    document.getElementById('f_Student_ID').value = '';
    document.getElementById('f_DOJ').disabled = false;
    document.getElementById('studentFormTitle').textContent = 'Add Student';
    document.getElementById('studentFormError').textContent = '';
    document.getElementById('studentFormModal').classList.add('active');
  });
  document.getElementById('closeStudentForm').addEventListener('click', function () {
    document.getElementById('studentFormModal').classList.remove('active');
  });

  function openEditStudent(studentId) {
    const s = allStudentsCache.find(function (x) { return x.Student_ID === studentId; }) || {};
    document.getElementById('f_Student_ID').value = studentId;
    document.getElementById('f_Student_Name').value = s.Student_Name || '';
    document.getElementById('f_Parent_Name').value = s.Parent_Name || '';
    document.getElementById('f_Parent_WhatsApp').value = s.Parent_WhatsApp || '';
    document.getElementById('f_School_Name').value = s.School_Name || '';
    document.getElementById('f_Class').value = s.Class || '';
    document.getElementById('f_Monthly_Fee').value = s.Monthly_Fee || '';
    document.getElementById('f_Teacher_ID').value = s.Teacher_ID || 'T001';
    document.getElementById('f_DOJ').disabled = true;
    document.getElementById('studentFormTitle').textContent = 'Edit Student';
    document.getElementById('studentFormError').textContent = '';
    document.getElementById('detailModal').classList.remove('active');
    document.getElementById('studentFormModal').classList.add('active');
  }

  document.getElementById('studentForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const studentId = document.getElementById('f_Student_ID').value;
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving...';

    const payload = {
      Student_Name: document.getElementById('f_Student_Name').value,
      Parent_Name: document.getElementById('f_Parent_Name').value,
      Parent_WhatsApp: document.getElementById('f_Parent_WhatsApp').value,
      School_Name: document.getElementById('f_School_Name').value,
      Class: document.getElementById('f_Class').value,
      Monthly_Fee: document.getElementById('f_Monthly_Fee').value,
      Teacher_ID: document.getElementById('f_Teacher_ID').value
    };
    let res;
    try {
      if (studentId) {
        payload.Student_ID = studentId;
        res = await api('updateStudent', payload);
      } else {
        payload.DOJ = document.getElementById('f_DOJ').value;
        res = await api('addStudent', payload);
      }
      if (res.success) {
        document.getElementById('studentFormModal').classList.remove('active');
        document.getElementById('f_DOJ').disabled = false;
        loadStudents();
      } else {
        document.getElementById('studentFormError').textContent = safeString(res.error);
      }
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save';
    }
  });

  // COLLECTIONS
  async function loadCollections() {
    const res = await api('getDashboard', {});
    if (!res.success) return;
    const d = res.data;
    document.getElementById('collectionKpis').innerHTML =
      kpiCard('Total Collection', '₹' + d.totalCollection.toLocaleString('en-IN'), 'collected') +
      kpiCard('This Month', '₹' + d.currentMonthCollection.toLocaleString('en-IN'), 'collected') +
      kpiCard('Outstanding', '₹' + d.totalOutstanding.toLocaleString('en-IN'), 'outstanding') +
      kpiCard('Active Students', d.activeStudents, '');
    document.getElementById('collectionByTeacher').innerHTML = Object.keys(d.byTeacher).map(function (tid) {
      const t = d.byTeacher[tid];
      return '<div class="student-card" style="cursor:default;"><div class="name">' + ADMIN_DISPLAY[tid] + '</div>' +
        '<div class="meta">Collection: <span style="color:var(--paid);font-weight:600;">₹' + t.collection.toLocaleString('en-IN') + '</span> · Outstanding: <span style="color:var(--late);font-weight:600;">₹' + t.outstanding.toLocaleString('en-IN') + '</span></div></div>';
    }).join('');
  }

  // MESSAGE LOGS
  document.getElementById('loadMsgBtn').addEventListener('click', async function () {
    const sid = document.getElementById('msgStudentFilter').value.trim();
    const res = await api('getMessageLogs', sid ? { studentId: sid } : {});
    const container = document.getElementById('msgList');
    if (!res.success || res.data.length === 0) { container.innerHTML = '<div class="empty-state">No messages found.</div>'; return; }
    container.innerHTML = res.data.map(function (m) {
      return '<div class="log-row"><div class="top"><span>' + m.Student_ID + ' · ' + m.Template_Name + '</span><span>' + (m.Delivery_Status || m.API_Status || 'PENDING') + '</span></div>' +
        '<div class="meta">' + (m.Sent_At || m.Queued_At || '') + '</div></div>';
    }).join('');
  });

  // SYNC
  document.getElementById('syncBtn').addEventListener('click', async function () {
    const btn = document.getElementById('syncBtn');
    btn.disabled = true;
    btn.textContent = 'Syncing...';
    const res = await api('createSyncJob', {});
    document.getElementById('syncResult').innerHTML = res.success
      ? '<div class="success-line">Sync complete — ' + res.data.created + ' new cycle(s) created' + (res.data.errors > 0 ? ', ' + res.data.errors + ' error(s), see Sync_Errors sheet' : '') + '.</div>'
      : '<div class="error-line">' + safeString(res.error) + '</div>';
    btn.disabled = false;
    btn.textContent = 'Press Sync';
    loadSyncJobs();
  });

  async function loadSyncJobs() {
    const res = await api('getRecentSyncJobs', {});
    const container = document.getElementById('syncJobList');
    if (!res.success || res.data.length === 0) { container.innerHTML = '<div class="empty-state">No sync jobs yet.</div>'; return; }
    container.innerHTML = res.data.map(function (j) {
      return '<div class="log-row"><div class="top"><span>' + j.Job_ID + ' · ' + j.Job_Status + '</span><span>' + j.Created_Records + ' created</span></div>' +
        '<div class="meta">' + j.Requested_At + '</div></div>';
    }).join('');
  }

  // CHANGE PASSWORD
  document.getElementById('changePwBtn').addEventListener('click', function () {
    document.getElementById('pwForm').reset();
    document.getElementById('pwError').textContent = '';
    document.getElementById('pwSuccess').textContent = '';
    document.getElementById('pwModal').classList.add('active');
  });
  document.getElementById('closePwModal').addEventListener('click', function () {
    document.getElementById('pwModal').classList.remove('active');
  });
  document.getElementById('pwForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const res = await api('changePassword', {
      currentPassword: document.getElementById('pw_current').value,
      newPassword: document.getElementById('pw_new').value
    });
    if (res.success) {
      document.getElementById('pwError').textContent = '';
      document.getElementById('pwSuccess').textContent = 'Password updated.';
      document.getElementById('pwForm').reset();
    } else {
      document.getElementById('pwSuccess').textContent = '';
      document.getElementById('pwError').textContent = safeString(res.error);
    }
  });

  loadOverview();
</script>

</body>
</html>
