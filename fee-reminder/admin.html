<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPN Fee Management</title>
<style>
  :root {
    --bg: #0a192f;
    --card-bg: #112240;
    --text: #e6f1ff;
    --text-muted: #8892b0;
    --link: #ffd54f;
    --cyan: #0e7490;
    --cyan-hover: #155e75;
    --border: #1d3461;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 60px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  h1 { font-size: 26px; color: var(--cyan); margin: 0; }
  .sub { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--link);
    color: var(--link);
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
  .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .controls input, .controls select {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 15px;
  }
  .controls input { flex: 1; min-width: 200px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--link);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
    position: relative;
  }
  .card.paid { border-left-color: #22c55e; opacity: 0.75; }
  .name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .name-row h3 { margin: 0; font-size: 19px; }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    border: 1px solid var(--link);
    color: var(--link);
  }
  .badge.late { border-color: var(--danger); color: var(--danger); }
  .badge.older-due { border-color: var(--text-muted); color: var(--text-muted); }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 8px; }
  .tag {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .dates { color: var(--text-muted); font-size: 13px; }
  .dates b { color: var(--text); }
  .amount { font-size: 22px; font-weight: 700; color: var(--cyan); text-align: right; }
  .right-col { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .mark-paid-btn {
    background: var(--cyan);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
  }
  .mark-paid-btn:hover { background: var(--cyan-hover); }
  .mark-paid-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .kebab {
    background: none; border: none; color: var(--text-muted); font-size: 20px;
    cursor: pointer; padding: 2px 8px; position: absolute; top: 14px; right: 14px;
  }
  .menu {
    display: none;
    position: absolute;
    top: 38px;
    right: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    z-index: 10;
    min-width: 170px;
  }
  .menu.open { display: block; }
  .menu button {
    display: block;
    width: 100%;
    background: none;
    border: none;
    color: var(--text);
    padding: 10px 16px;
    text-align: left;
    font-size: 14px;
    cursor: pointer;
  }
  .menu button:hover { background: var(--bg); }
  .menu button.danger { color: var(--danger); }
  .empty { color: var(--text-muted); text-align: center; padding: 60px 0; }
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; width: 100%; max-width: 360px;
  }
  .modal h3 { margin-top: 0; color: var(--danger); }
  .modal input {
    width: 100%; padding: 10px; margin: 12px 0; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
  .modal-actions .cancel { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .modal-actions .confirm { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<header>
  <div>
    <h1>GPN Fee Management</h1>
    <div class="sub">Logged in as: <span id="teacherName"></span></div>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="btn-outline" onclick="openPasswordModal()">Change Password</button>
    <button class="btn-outline" onclick="logout()">Logout</button>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Search by name, phone, or parent…" oninput="debouncedLoad()">
  <select id="filter" onchange="loadDashboard()">
    <option value="All Unpaid">All Unpaid</option>
    <option value="Upcoming">Upcoming</option>
    <option value="Paid">Paid</option>
    <option value="All">All</option>
  </select>
</div>

<div id="cards"></div>

<div class="modal-backdrop" id="deleteModal">
  <div class="modal">
    <h3>Hard Delete Student</h3>
    <p>This permanently wipes this student's rows from Students, Fee_Cycles, Payments and Message_Log. This cannot be undone.</p>
    <p>Type <b>DELETE</b> to confirm:</p>
    <input type="text" id="deleteConfirmInput">
    <div class="modal-actions">
      <button class="cancel" onclick="closeDeleteModal()">Cancel</button>
      <button class="confirm" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="passwordModal">
  <div class="modal">
    <h3 style="color: var(--cyan);">Change Password</h3>
    <input type="password" id="oldPasswordInput" placeholder="Current password">
    <input type="password" id="newPasswordInput" placeholder="New password (min 8 characters)">
    <input type="password" id="confirmPasswordInput" placeholder="Confirm new password">
    <div class="error" id="passwordError" style="color:#ff6b6b; font-size:13px; min-height:16px; margin-bottom:8px;"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closePasswordModal()">Cancel</button>
      <button class="confirm" style="background: var(--cyan);" onclick="confirmChangePassword()">Save</button>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbx9YoiIwRok4D-YaNNkg1LHyuc5ZngbwKAv7TLNsbKZr1Jk_ntf5lhpBiG3bW-ibkJ_fQ/exec';

  let token = sessionStorage.getItem('gpn_token');
  let pendingDeleteStudentId = null;
  let debounceTimer = null;

  if (!token) window.location.href = 'index.html';
  document.getElementById('teacherName').textContent = sessionStorage.getItem('gpn_teacher_name') || '';

  async function api(action, payload) {
    const body = Object.assign({ token: token }, payload || {});
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, payload: body })
    });
    return res.json();
  }

  function debouncedLoad() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadDashboard, 350);
  }

  async function loadDashboard() {
    const filter = document.getElementById('filter').value;
    const search = document.getElementById('search').value;
    const container = document.getElementById('cards');

    const data = await api('getDashboard', { filter: filter, search: search });

    if (!data.success) {
      if (data.error && data.error.indexOf('Session') !== -1) {
        sessionStorage.clear();
        window.location.href = 'index.html';
        return;
      }
      container.innerHTML = '<div class="empty">' + escapeHtml(data.error || 'Failed to load.') + '</div>';
      return;
    }

    if (!data.cards.length) {
      container.innerHTML = '<div class="empty">No matching students.</div>';
      return;
    }

    container.innerHTML = data.cards.map(renderCard).join('');
  }

  function renderCard(c) {
    const isPaid = c.status === 'Paid';
    const lateBadge = c.daysLate > 0
      ? '<span class="badge late">' + c.daysLate + ' DAYS LATE</span>'
      : '<span class="badge">' + c.status.toUpperCase() + '</span>';
    const olderDue = c.hasOlderDue ? '<span class="badge older-due">HAS OLDER DUE</span>' : '';

    return '<div class="card ' + (isPaid ? 'paid' : '') + '" data-cycle="' + c.cycleId + '">' +
      '<button class="kebab" onclick="toggleMenu(this)">⋮</button>' +
      '<div class="menu">' +
        '<button onclick="inactivate(\'' + c.studentId + '\')">Inactivate student</button>' +
        '<button class="danger" onclick="openDeleteModal(\'' + c.studentId + '\')">Hard delete student</button>' +
      '</div>' +
      '<div class="name-row"><h3>' + escapeHtml(c.studentName) + '</h3>' + lateBadge + olderDue + '</div>' +
      '<div class="tags">' +
        '<span class="tag">👤 ' + escapeHtml(c.parentName || '') + '</span>' +
        '<span class="tag">📞 ' + escapeHtml(c.parentPhone || '') + '</span>' +
        '<span class="tag">🏫 ' + escapeHtml(c.schoolName || '') + '</span>' +
        '<span class="tag">📚 ' + escapeHtml(c.className || '') + '</span>' +
      '</div>' +
      '<div style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap: wrap; gap: 12px;">' +
        '<div class="dates">Cycle Start: <b>' + c.cycleStart + '</b> &nbsp;|&nbsp; Due Date: <b>' + c.dueDate + '</b></div>' +
        '<div class="right-col">' +
          '<div class="amount">₹' + c.amount + '</div>' +
          (isPaid ? '' : '<button class="mark-paid-btn" onclick="markPaid(\'' + c.cycleId + '\', this)">Mark Paid</button>') +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, function (m) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m];
    });
  }

  function toggleMenu(btn) {
    document.querySelectorAll('.menu.open').forEach(function (m) {
      if (m !== btn.nextElementSibling) m.classList.remove('open');
    });
    btn.nextElementSibling.classList.toggle('open');
  }

  document.addEventListener('click', function (e) {
    if (!e.target.classList.contains('kebab')) {
      document.querySelectorAll('.menu.open').forEach(function (m) { m.classList.remove('open'); });
    }
  });

  async function markPaid(cycleId, btn) {
    btn.disabled = true;
    btn.textContent = 'Saving…';
    const data = await api('markPaid', { cycleId: cycleId });
    if (data.success) {
      loadDashboard();
    } else {
      alert(data.error || 'Failed to mark paid.');
      btn.disabled = false;
      btn.textContent = 'Mark Paid';
    }
  }

  async function inactivate(studentId) {
    if (!confirm('Inactivate this student? They will stop appearing on the dashboard and stop receiving reminders.')) return;
    const data = await api('inactivateStudent', { studentId: studentId });
    if (data.success) loadDashboard();
    else alert(data.error || 'Failed.');
  }

  function openDeleteModal(studentId) {
    pendingDeleteStudentId = studentId;
    document.getElementById('deleteConfirmInput').value = '';
    document.getElementById('deleteModal').classList.add('open');
  }
  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('open');
    pendingDeleteStudentId = null;
  }
  async function confirmDelete() {
    const confirmText = document.getElementById('deleteConfirmInput').value;
    const data = await api('deleteStudent', { studentId: pendingDeleteStudentId, confirmText: confirmText });
    closeDeleteModal();
    if (data.success) loadDashboard();
    else alert(data.error || 'Failed.');
  }

  function logout() {
    sessionStorage.clear();
    window.location.href = 'index.html';
  }

  function openPasswordModal() {
    document.getElementById('oldPasswordInput').value = '';
    document.getElementById('newPasswordInput').value = '';
    document.getElementById('confirmPasswordInput').value = '';
    document.getElementById('passwordError').textContent = '';
    document.getElementById('passwordModal').classList.add('open');
  }
  function closePasswordModal() {
    document.getElementById('passwordModal').classList.remove('open');
  }
  async function confirmChangePassword() {
    const oldPassword = document.getElementById('oldPasswordInput').value;
    const newPassword = document.getElementById('newPasswordInput').value;
    const confirmPassword = document.getElementById('confirmPasswordInput').value;
    const errorEl = document.getElementById('passwordError');

    if (!oldPassword || !newPassword) {
      errorEl.textContent = 'Fill in all fields.';
      return;
    }
    if (newPassword !== confirmPassword) {
      errorEl.textContent = 'New passwords do not match.';
      return;
    }

    const data = await api('changePassword', { oldPassword: oldPassword, newPassword: newPassword });
    if (data.success) {
      closePasswordModal();
      sessionStorage.clear();
      alert('Password changed. Please log in again.');
      window.location.href = 'index.html';
    } else {
      errorEl.textContent = data.error || 'Failed to change password.';
    }
  }

  loadDashboard();
</script>
</body>
</html>
