<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPN Fee Management — Login</title>
<style>
  :root {
    --bg: #0a192f;
    --card-bg: #112240;
    --text: #e6f1ff;
    --text-muted: #8892b0;
    --link: #ffd54f;
    --cyan: #0e7490;
    --cyan-hover: #155e75;
    --border: #1d3461;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--link); }
  p.sub { color: var(--text-muted); margin: 0 0 24px; font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  select, input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
  }
  select:focus, input:focus { outline: none; border-color: var(--cyan); }
  button {
    width: 100%;
    padding: 12px;
    background: var(--cyan);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--cyan-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: #ff6b6b; font-size: 13px; margin: -8px 0 16px; min-height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>GPN Fee Management</h1>
    <p class="sub">Sign in to continue</p>

    <label for="teacher">Teacher</label>
    <select id="teacher"><option value="">Loading…</option></select>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••">

    <div class="error" id="error"></div>

    <button id="loginBtn" onclick="login()">Log In</button>
  </div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbx9YoiIwRok4D-YaNNkg1LHyuc5ZngbwKAv7TLNsbKZr1Jk_ntf5lhpBiG3bW-ibkJ_fQ/exec';

  async function api(action, payload) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, payload: payload })
    });
    return res.json();
  }

  async function loadTeachers() {
    const sel = document.getElementById('teacher');
    try {
      const data = await api('getTeachers', {});
      sel.innerHTML = '<option value="">Select teacher…</option>';
      (data.teachers || []).forEach(function (t) {
        const opt = document.createElement('option');
        opt.value = t.Teacher_ID;
        opt.textContent = t.Teacher_Name;
        sel.appendChild(opt);
      });
    } catch (e) {
      sel.innerHTML = '<option value="">Failed to load — check API_URL</option>';
    }
  }

  async function login() {
    const teacherId = document.getElementById('teacher').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('loginBtn');
    errorEl.textContent = '';

    if (!teacherId || !password) {
      errorEl.textContent = 'Select a teacher and enter the password.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Logging in…';

    try {
      const data = await api('login', { teacherId: teacherId, password: password });
      if (data.success) {
        sessionStorage.setItem('gpn_token', data.token);
        sessionStorage.setItem('gpn_teacher_name', data.teacherName);
        window.location.href = 'admin.html';
      } else {
        errorEl.textContent = data.error || 'Login failed.';
      }
    } catch (e) {
      errorEl.textContent = 'Could not reach the server.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  }

  loadTeachers();
</script>
</body>
</html>
