<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guided Path Noida - Portal</title>
  <style>
    :root {
      --bg-dark: #0A192F;
      --card-bg: #112240;
      --text-main: #CCD6F6;
      --text-muted: #8892B0;
      --cyan: #00FFFF;
      --gold: #FFD54F;
      --error: #FF6B6B;
    }
    
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background-color: var(--card-bg);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 360px;
      text-align: center;
      border: 1px solid rgba(0, 255, 255, 0.1);
    }

    .logo-placeholder {
      font-size: 24px;
      font-weight: bold;
      color: var(--cyan);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--gold);
      font-size: 14px;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      background-color: rgba(2, 12, 27, 0.7);
      border: 1px solid #233554;
      border-radius: 6px;
      color: var(--text-main);
      font-size: 16px;
      box-sizing: border-box;
      transition: border 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--cyan);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--cyan);
      color: var(--bg-dark);
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .login-btn:hover {
      background-color: #00cccc;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
    }

    .status-msg {
      margin-top: 20px;
      font-size: 14px;
      min-height: 20px;
    }

    .error { color: var(--error); }
    .loading { color: var(--gold); }
    
    a {
      color: var(--gold);
      text-decoration: none;
      font-size: 12px;
      display: inline-block;
      margin-top: 15px;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-placeholder">Guided Path Noida</div>
    <div class="subtitle">Teacher Portal</div>

    <div class="input-group">
      <label>Admin ID</label>
      <input type="text" id="userId" placeholder="e.g. T001" autocomplete="off">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••">
    </div>

    <button class="login-btn" onclick="attemptLogin()" id="loginBtn">LOGIN →</button>
    <div id="status" class="status-msg"></div>
    
    <a href="mailto:fees_agent@guidedpathnoida.in">Trouble logging in? Contact Support</a>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx9YoiIwRok4D-YaNNkg1LHyuc5ZngbwKAv7TLNsbKZr1Jk_ntf5lhpBiG3bW-ibkJ_fQ/exec";

    async function attemptLogin() {
      const btn = document.getElementById('loginBtn');
      const status = document.getElementById('status');
      const userId = document.getElementById('userId').value.trim();
      const pass = document.getElementById('password').value.trim();

      if(!userId || !pass) {
        status.className = 'status-msg error';
        status.innerText = 'Please enter both ID and Password.';
        return;
      }

      btn.innerText = 'VERIFYING...';
      btn.disabled = true;
      status.className = 'status-msg loading';
      status.innerText = 'Authenticating securely...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'login', userId: userId, password: pass })
        });

        const res = await response.json();

        if(res.success) {
          sessionStorage.setItem('gpn_token', res.token);
          sessionStorage.setItem('gpn_name', res.name);
          status.innerText = 'Success! Redirecting...';
          window.location.href = "admin.html"; 
        } else {
          status.className = 'status-msg error';
          status.innerText = res.message;
          btn.innerText = 'LOGIN →';
          btn.disabled = false;
        }
      } catch (err) {
        status.className = 'status-msg error';
        status.innerText = 'Network error. Check connection.';
        btn.innerText = 'LOGIN →';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
