<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPN Fee Management</title>
<style>
  :root {
    --bg: #0A192F;
    --link: #FFD54F;
    --cyan: #17B4C9;
    --cyan-dark: #0E8A9C;
    --card-bg: #112a4a;
    --input-bg: #0d2240;
    --border: #1e3a5f;
    --text: #E6EEF7;
    --text-dim: #9fb3c8;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, Roboto, Segoe UI, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 24px;
  }
  h1 { color: var(--link); font-size: 26px; margin: 0 0 4px 0; }
  .subtitle { color: var(--text-dim); margin: 0 0 28px 0; font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; margin-top: 18px; }
  select, input[type="password"] {
    width: 100%; padding: 12px 14px; background: var(--input-bg);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px;
  }
  select:focus, input:focus { outline: none; border-color: var(--cyan); }
  .password-wrap { position: relative; }
  .toggle-pw {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-dim); font-size: 13px; cursor: pointer; padding: 4px 6px;
  }
  button.submit {
    width: 100%; margin-top: 26px; padding: 14px; background: var(--cyan);
    color: #06202a; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button.submit:active { background: var(--cyan-dark); }
  button.submit:disabled { opacity: 0.6; }
  .error-line { margin-top: 14px; color: var(--error); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>

<div class="card">
  <h1>GPN Fee Management</h1>
  <p class="subtitle">Sign in to continue</p>

  <form id="loginForm">
    <label for="adminSelect">Administrator</label>
    <select id="adminSelect" required>
      <option value="" disabled selected>Select administrator...</option>
      <option value="T001">Super Admin</option>
      <option value="T002">Academic Head</option>
    </select>

    <label for="password">Password</label>
    <div class="password-wrap">
      <input type="password" id="password" required autocomplete="current-password">
      <button type="button" class="toggle-pw" id="togglePw">Show</button>
    </div>

    <button type="submit" class="submit" id="submitBtn">Log In</button>
    <div class="error-line" id="errorLine"></div>
  </form>
</div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx9YoiIwRok4D-YaNNkg1LHyuc5ZngbwKAv7TLNsbKZr1Jk_ntf5lhpBiG3bW-ibkJ_fQ/exec';

  const form = document.getElementById('loginForm');
  const adminSelect = document.getElementById('adminSelect');
  const passwordInput = document.getElementById('password');
  const togglePw = document.getElementById('togglePw');
  const submitBtn = document.getElementById('submitBtn');
  const errorLine = document.getElementById('errorLine');

  togglePw.addEventListener('click', function () {
    const isPw = passwordInput.type === 'password';
    passwordInput.type = isPw ? 'text' : 'password';
    togglePw.textContent = isPw ? 'Hide' : 'Show';
  });

  if (sessionStorage.getItem('gpn_token')) {
    window.location.href = 'admin.html';
  }

  // FIX: never hand a non-string value straight to .textContent —
  // that's what produced the literal "[object Object]" on screen.
  function safeString(val) {
    if (typeof val === 'string') return val;
    if (val === null || val === undefined) return '';
    try { return JSON.stringify(val); } catch (e) { return 'Unknown error'; }
  }

  function errorMessage(rawError) {
    const code = safeString(rawError);
    const map = {
      'MISSING_CREDENTIALS': 'Select an administrator and enter a password.',
      'INVALID_CREDENTIALS': 'Incorrect administrator or password.',
      'ACCOUNT_LOCKED': 'Too many failed attempts. Try again in 15 minutes.',
      'SERVER_ERROR': 'Something went wrong. Try again.'
    };
    if (map[code]) return map[code];
    return code || 'Login failed. Try again.';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorLine.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';

    try {
      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'login',
          payload: { adminId: adminSelect.value, password: passwordInput.value }
        })
      });

      if (!res.ok) {
        errorLine.textContent = 'Server error (HTTP ' + res.status + '). Check the Apps Script deployment is accessible.';
        return;
      }

      let data;
      try {
        data = await res.json();
      } catch (parseErr) {
        errorLine.textContent = 'Unexpected response from server. The deployment may need re-authorizing.';
        return;
      }

      if (data && data.success) {
        sessionStorage.setItem('gpn_token', data.data.token);
        sessionStorage.setItem('gpn_adminId', data.data.adminId);
        sessionStorage.setItem('gpn_displayName', data.data.displayName);
        window.location.href = 'admin.html';
      } else {
        errorLine.textContent = errorMessage(data ? data.error : 'Login failed.');
      }
    } catch (err) {
      errorLine.textContent = 'Could not reach the server. Check your connection.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });
</script>

</body>
</html>
